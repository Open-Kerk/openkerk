name: Deploy

on:
  # Auto-deploy on any push that changes app code, templates, translations,
  # or the image definition.
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'templates/**'
      - 'translations/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  # Manual button in the Actions tab to force a rebuild + redeploy.
  workflow_dispatch:

# Only one deploy at a time.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Rebuild the Docker image, push it to DOCR, and force a DO redeploy
      # so the change is visible on the live site within minutes.
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Build + push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: registry.digitalocean.com/foundry-registry/openkerk:latest

      - name: Trigger DigitalOcean redeploy
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header \
                   | awk '$2 == "openkerk" {print $1}')
          if [ -z "$APP_ID" ]; then
            echo "No openkerk app found on this DO account; skipping redeploy"
            exit 0
          fi
          doctl apps create-deployment "$APP_ID" --wait=false \
                --format ID,Phase --no-header
