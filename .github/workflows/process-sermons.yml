name: Process sermons

on:
  # Steady state: one sermon a week, dropped on Sunday. We run Sunday at
  # 20:00 UTC (22:00 Belgium time), max_videos=2 so we'd still catch a
  # week with a bonus video. For one-off backfills use workflow_dispatch.
  schedule:
    - cron: '0 20 * * 0'
  # Auto-deploy on any push that changes app code, templates, scripts,
  # translations, or the curated collections file. Sermon processing is
  # skipped on push triggers (see `if: github.event_name != 'push'`
  # below) — we just rebuild the image and ship it.
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'scripts/**'
      - 'templates/**'
      - 'translations/**'
      - 'data/collections.yaml'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/process-sermons.yml'
  # Manual button in the Actions tab for backfilling or retry.
  workflow_dispatch:
    inputs:
      max_videos:
        description: 'Max videos to process this run (use larger numbers for backfill)'
        required: false
        default: '2'
      vimeo_id:
        description: 'Specific Vimeo id (overrides the queue if set)'
        required: false
      reprocess:
        description: 'Force reprocess (ignore processed_at)'
        required: false
        default: 'false'
      force_deploy:
        description: 'Build + push image + deploy even if no DB changes (use for template-only updates)'
        required: false
        default: 'false'
      relabel_generic:
        description: 'Re-title sermons stuck on the generic "Open Kerk online dienst" placeholder, then deploy'
        required: false
        default: 'false'

# Only one run at a time — they all write to the same sermons.db.
concurrency:
  group: process-sermons
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write   # to push DB + VTT updates back to main
    steps:
      - uses: actions/checkout@v4
        with:
          # We commit back; need a token that can push.
          token: ${{ secrets.GITHUB_TOKEN }}
          # data/sermons.db has crossed the 100 MB single-file limit so it's
          # tracked via Git LFS. Without lfs:true the working tree gets the
          # pointer files (~134 bytes) instead of the real DB, which would
          # silently break the Docker build (Flask app would see an empty
          # archive). Bandwidth cost is negligible on the GH-hosted runner.
          lfs: true

      # On push events we only rebuild + redeploy the Docker image; the
      # heavy host-side deps (ffmpeg, Python 3.12, all pip packages
      # including PyTorch + silero-vad ~700 MB) aren't needed. Skipping
      # them frees ~2 GB of runner disk, which matters now that the
      # LFS-tracked sermons.db pulls into the workspace too.
      - name: Install system deps
        if: github.event_name != 'push'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Sync Vimeo library -> DB
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          VIMEO_USER_ID: ${{ secrets.VIMEO_USER_ID }}
        run: python -m scripts.sync_vimeo

      # Idempotent — only acts on videos with no privacy_whitelist_at
      # timestamp (i.e. just synced for the first time). Existing rows
      # were backfilled by the migration so the typical Sunday run
      # touches just the new sermon(s).
      - name: Whitelist embed privacy for newly-synced videos
        if: github.event_name != 'push'
        env:
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          VIMEO_USER_ID: ${{ secrets.VIMEO_USER_ID }}
        run: python -m scripts.set_privacy

      # Self-healing step: any 'done' video that still has NULL display_title_nl
      # gets a clean title + en/fr/es translations generated from its existing
      # transcript. Happens before the main process step so even an empty
      # queue tick can clear up the backlog. Costs ~$0.001/video.
      - name: Backfill missing display titles
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.backfill_titles

      # Self-healing step: re-title sermons stuck on the generic
      # "Open Kerk online dienst" placeholder by sampling the MIDDLE of
      # their transcript (where the actual preaching happens) and asking
      # gpt-4o for a specific theme. Runs every cron tick — idempotent,
      # only acts on rows whose current display_title_nl is still
      # generic, so on a typical Sunday with no newly-generic titles
      # this is a no-op. ~$0.005 per video that genuinely needs fixing.
      - name: Relabel generic-titled sermons
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.relabel_generic

      # Per-video loop: process ONE video, commit + push, repeat. This
      # keeps progress durable on long backfill runs — if the job is
      # killed by the 180-min timeout (or any other failure), only the
      # video currently in flight is lost; everything previously processed
      # is already on origin/main. The 'commit' step output flips to true
      # the first time we push anything so the deploy steps below still fire.
      - name: Process queued videos
        id: commit
        if: github.event_name != 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          VIMEO_USER_ID: ${{ secrets.VIMEO_USER_ID }}
        run: |
          set +e
          git config user.name  "openkerk-bot"
          git config user.email "openkerk-bot@users.noreply.github.com"

          # Backfill-titles also touches the DB; capture the result of that
          # earlier step by checking diff against origin/main below.
          MAX="${{ github.event.inputs.max_videos || '2' }}"
          REPROC=""
          [ "${{ github.event.inputs.reprocess }}" = "true" ] && REPROC="--reprocess"
          VID="${{ github.event.inputs.vimeo_id }}"

          any_changed=false

          # Single specific vimeo_id mode: just process the one and commit.
          if [ -n "$VID" ]; then
            python -m scripts.process_video --id "$VID" $REPROC || true
            MAX=0  # skip the iteration loop below
          fi

          # Iteration loop: each iteration processes 1 video, commits, pushes.
          for i in $(seq 1 "$MAX"); do
            python -m scripts.process_video --max 1 $REPROC || true

            [ -f data/sermons.db ] && git add data/sermons.db
            [ -d templates/assets/subtitles ] && git add templates/assets/subtitles/

            if git diff --cached --quiet; then
              # No new changes -> either queue is empty or this iteration
              # produced nothing (e.g. the failed video that just stayed
              # failed). Stop early.
              echo "no changes on iteration $i; queue likely empty"
              break
            fi

            git commit -m "auto: processed video (batch iter $i)"
            # Rebase + retry push to handle races with humans / other workflows.
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin main; then
                pushed=true
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 10))
            done
            if $pushed; then
              any_changed=true
            else
              echo "push failed after 3 attempts on iter $i; bailing"
              break
            fi
          done

          # Final pickup — covers the single-vimeo_id mode and any earlier
          # uncommitted residue (e.g. from backfill_titles).
          [ -f data/sermons.db ] && git add data/sermons.db
          [ -d templates/assets/subtitles ] && git add templates/assets/subtitles/
          if ! git diff --cached --quiet; then
            git commit -m "auto: process sermon transcripts (final)"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin main; then
                any_changed=true
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 10))
            done
          fi

          if $any_changed; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # Free disk on the runner before Docker buildx fills it. The
      # process_video step downloads MP4s + extracts audio to /tmp; on a
      # cron run with two long sermons that's 2-3 GB of leftover files.
      # The buildx step then has to install PyTorch (huge wheel) inside
      # the container — without this cleanup we've hit "No space left on
      # device" mid-pip-install. apt-get clean + /tmp purge frees ~5 GB
      # consistently on the github-hosted runners.
      - name: Free disk before Docker build
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true' || github.event_name == 'push'
        run: |
          df -h /
          sudo rm -rf /tmp/tmp* /tmp/*.mp4 /tmp/*.ogg /tmp/sermons.backup.db 2>/dev/null || true
          sudo apt-get clean
          # Remove preinstalled toolchains we don't use to reclaim space on
          # standard github-hosted runners. Safe — none of these are used
          # by the Docker buildx step.
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android /usr/share/swift 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          df -h /

      # Below: only fires when the commit step actually committed. Rebuilds
      # the Docker image with the new DB+VTTs baked in, pushes to DOCR, and
      # forces a DO redeploy so the new sermon is visible on the live site
      # within minutes.
      - name: Install doctl
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true' || github.event_name == 'push'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up Docker buildx
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true' || github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Log into DOCR
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true' || github.event_name == 'push'
        run: doctl registry login --expiry-seconds 1200

      - name: Build + push linux/amd64 image
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true' || github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: registry.digitalocean.com/foundry-registry/openkerk:latest

      - name: Trigger DigitalOcean redeploy
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true' || github.event_name == 'push'
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header \
                   | awk '$2 == "openkerk" {print $1}')
          if [ -z "$APP_ID" ]; then
            echo "No openkerk app found on this DO account; skipping redeploy"
            exit 0
          fi
          doctl apps create-deployment "$APP_ID" --wait=false \
                --format ID,Phase --no-header
