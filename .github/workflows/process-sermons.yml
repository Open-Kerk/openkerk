name: Process sermons

on:
  # Every 15 minutes — picks up Vimeo webhook-queued ids and processes
  # one video per run (Whisper + 3 x translate + embed ≈ 1-3 min).
  schedule:
    - cron: '*/15 * * * *'
  # Manual button in the Actions tab for backfilling or retry.
  workflow_dispatch:
    inputs:
      max_videos:
        description: 'Max videos to process this run'
        required: false
        default: '1'
      vimeo_id:
        description: 'Specific Vimeo id (overrides the queue if set)'
        required: false
      reprocess:
        description: 'Force reprocess (ignore processed_at)'
        required: false
        default: 'false'

# Only one run at a time — they all write to the same sermons.db.
concurrency:
  group: process-sermons
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to push DB + VTT updates back to main
    steps:
      - uses: actions/checkout@v4
        with:
          # We commit back; need a token that can push.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Sync Vimeo library -> DB
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          VIMEO_USER_ID: ${{ secrets.VIMEO_USER_ID }}
        run: python -m scripts.sync_vimeo

      - name: Process queued videos
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          VIMEO_USER_ID: ${{ secrets.VIMEO_USER_ID }}
        run: |
          ARGS="--max ${{ github.event.inputs.max_videos || '1' }}"
          if [ -n "${{ github.event.inputs.vimeo_id }}" ]; then
            ARGS="--id ${{ github.event.inputs.vimeo_id }}"
          fi
          if [ "${{ github.event.inputs.reprocess }}" = "true" ]; then
            ARGS="$ARGS --reprocess"
          fi
          python -m scripts.process_video $ARGS

      - name: Commit and push
        run: |
          git config user.name  "openkerk-bot"
          git config user.email "openkerk-bot@users.noreply.github.com"
          git add data/sermons.db templates/assets/subtitles/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto: process sermon transcripts"
          git push
