name: Process sermons

on:
  # Every 15 minutes — picks up Vimeo webhook-queued ids and processes
  # one video per run (Whisper + 3 x translate + embed ≈ 1-3 min).
  schedule:
    - cron: '*/15 * * * *'
  # Manual button in the Actions tab for backfilling or retry.
  workflow_dispatch:
    inputs:
      max_videos:
        description: 'Max videos to process this run'
        required: false
        default: '3'
      vimeo_id:
        description: 'Specific Vimeo id (overrides the queue if set)'
        required: false
      reprocess:
        description: 'Force reprocess (ignore processed_at)'
        required: false
        default: 'false'
      force_deploy:
        description: 'Build + push image + deploy even if no DB changes (use for template-only updates)'
        required: false
        default: 'false'

# Only one run at a time — they all write to the same sermons.db.
concurrency:
  group: process-sermons
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # to push DB + VTT updates back to main
    steps:
      - uses: actions/checkout@v4
        with:
          # We commit back; need a token that can push.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Sync Vimeo library -> DB
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          VIMEO_USER_ID: ${{ secrets.VIMEO_USER_ID }}
        run: python -m scripts.sync_vimeo

      # Self-healing step: any 'done' video that still has NULL display_title_nl
      # gets a clean title + en/fr/es translations generated from its existing
      # transcript. Happens before the main process step so even an empty
      # queue tick can clear up the backlog. Costs ~$0.001/video.
      - name: Backfill missing display titles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m scripts.backfill_titles

      - name: Process queued videos
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          VIMEO_USER_ID: ${{ secrets.VIMEO_USER_ID }}
        run: |
          ARGS="--max ${{ github.event.inputs.max_videos || '3' }}"
          if [ -n "${{ github.event.inputs.vimeo_id }}" ]; then
            ARGS="--id ${{ github.event.inputs.vimeo_id }}"
          fi
          if [ "${{ github.event.inputs.reprocess }}" = "true" ]; then
            ARGS="$ARGS --reprocess"
          fi
          python -m scripts.process_video $ARGS

      - name: Commit and push
        id: commit
        run: |
          git config user.name  "openkerk-bot"
          git config user.email "openkerk-bot@users.noreply.github.com"
          # Add each pathspec independently so a missing subtitles dir on
          # sync-only runs does not abort the DB add.
          [ -f data/sermons.db ] && git add data/sermons.db
          [ -d templates/assets/subtitles ] && git add templates/assets/subtitles/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "auto: process sermon transcripts"
          # Rebase onto remote in case humans (or other workflows) pushed
          # while we were processing — long sermon runs can take 30+ min,
          # plenty of time for a race. Retry a few times in case of churn.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin main; then
              echo "pushed on attempt $attempt"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "push failed after 3 attempts"
          exit 1

      # Below: only fires when the commit step actually committed. Rebuilds
      # the Docker image with the new DB+VTTs baked in, pushes to DOCR, and
      # forces a DO redeploy so the new sermon is visible on the live site
      # within minutes.
      - name: Install doctl
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Set up Docker buildx
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log into DOCR
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        run: doctl registry login --expiry-seconds 1200

      - name: Build + push linux/amd64 image
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: registry.digitalocean.com/foundry-registry/openkerk:latest

      - name: Trigger DigitalOcean redeploy
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header \
                   | awk '$2 == "openkerk" {print $1}')
          if [ -z "$APP_ID" ]; then
            echo "No openkerk app found on this DO account; skipping redeploy"
            exit 0
          fi
          doctl apps create-deployment "$APP_ID" --wait=false \
                --format ID,Phase --no-header
