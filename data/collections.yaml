# Curated sermon collections shown as tabs on /teachings.
#
# Edit the `vimeo_ids` lists below — add or remove ids — commit, and the
# next deploy picks them up. Order is preserved (top of the list first
# in the UI).
#
# To find vimeo_ids: open /teachings, hover any row — the URL is
#   /teachings/<vimeo_id>
# Or query the DB:
#   sqlite3 data/sermons.db "select vimeo_id, display_title_nl from videos where transcript_status='done'"
#
# Each vimeo_id has a NL-title comment beside it for editing convenience;
# the title text is informational only — the system uses just the id.

collections:

  essenties:
    label:
      nl: Essenties
      en: Essentials
      fr: Essentiels
      es: Esenciales
    # Foundational sermons for new visitors — welcome message, the gospel,
    # the person of Jesus, grace, repentance, scripture, surrender, trust.
    # Time-bound or seasonal "Welkom" sermons (e.g. Paasmaand, schooljaar)
    # deliberately excluded.
    vimeo_ids:
      - 1173724658  # Welkom in Open Kerk: Ontdek de Heer in je leven
