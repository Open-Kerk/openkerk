  kinder_kicker: De 6 à 12 ans
  kinder_title: Camp pour enfants
  kinder_tagline: 'Ensemble vers un seul but : rencontrer Jésus !'
  kinder_when_value: 16 – 19 août
  kinder_cost_value: € 95
  kinder_who_value: École primaire, 6–12 ans
  kinder_location_value: Nieuwe Kopen 14, Lommel
  kinder_theme_value: Premier amour
  kinder_intro: 'Chaque année, nous organisons un magnifique camp pour les enfants de l''école primaire, avec un but clair : rencontrer Jésus. Les enfants n''apprennent pas seulement à Son sujet, ils peuvent aussi Le vivre à travers l''enseignement, la prière, la louange & l''adoration et beaucoup de temps pour faire du sport, jouer et nouer des amitiés.'
  kinder_faq1_title: Le public visé
  kinder_faq1_body: <p>Pour tous les enfants de l'école primaire (à partir de 6 ans), avec ou sans bagage chrétien. Tu es le bienvenu !</p>
  kinder_faq2_title: Les activités
  kinder_faq2_body: '<p>Chaque jour, nous commençons par un culte autour du thème. Ensuite, nous passons à des activités créatives et dynamiques. Le soir, il y a un culte de louange. Entre-temps : sport, jeux, plein air et plaisir.</p>'
  kinder_faq3_title: Le thème Premier amour
  kinder_faq3_body: <p>Nous aimons Dieu parce qu'Il nous a aimés le premier (Jean 3:16). En trois jours, nous explorons à travers la Bible la grandeur de l'amour de Jésus pour nous, et ce que signifie aimer Dieu de tout son cœur, de toute son âme et de tout son esprit.</p>
  kinder_faq4_title: Inscription
  kinder_faq4_body: <p>L'inscription est possible jusqu'au 14 juin 2026. La participation est soumise à l'acceptation du règlement du camp. Une fois le formulaire rempli et le paiement reçu, l'inscription est complète. Tu ne recevras pas de confirmation par e-mail.</p>
  kinder_faq5_title: Le paiement
  kinder_faq5_body: '<p>Le coût s''élève à € 95 et doit être versé au plus tard le 1 juillet 2026 sur le compte de la Kinderkerk :</p><p><strong>NL82 ABNA 0246 4531 92</strong> au nom de Kinderkerk<br>Avec la mention : Nom de l''enfant + Kinderkamp 2026</p><p>Deux versements sont aussi possibles : € 50 avant le 1 juin et € 45 avant le 1 juillet.</p>'
  kinder_cta: S'inscrire au Camp pour enfants
  jong_kicker: École secondaire
  jong_title: Jong° Summer Camp
  jong_tagline: Quatre jours, un seul but
  jong_when_value: 19 – 22 août
  jong_cost_value: € 110
  jong_who_value: À partir de l'école secondaire
  jong_location_value: Nieuwe Kopen 14, Lommel
  jong_theme_value: Inside Out
  jong_intro: 'Quatre jours durant lesquels, dans une ambiance conviviale et avec beaucoup de rires, nous partageons un seul but : mieux connaître Jésus comme notre Ami, Sauveur et Aide. Avec des cultes pour les jeunes, de la louange, des activités Fun & Adventure et beaucoup de temps libre.'
  jong_faq1_title: Le public visé
  jong_faq1_body: <p>Pour les jeunes à partir de l'école secondaire, avec ou sans bagage chrétien. Tu as plus de 18 ans et tu veux venir ? Bienvenue nous te demanderons alors d'aider avec une tâche.</p>
  jong_faq2_title: Les activités
  jong_faq2_body: '<p>Des cultes pour les jeunes avec de la louange et des thèmes vraiment utiles dans ta vie quotidienne, de chouettes activités Fun & Adventure, et du temps libre pour mieux connaître Dieu autant que tes amis. Et surtout : beaucoup de plaisir et de convivialité.</p>'
  jong_faq3_title: Le thème Inside Out
  jong_faq3_body: <p>L'enseignement porte sur notre intérieur et notre extérieur. Lorsque nous changeons de l'intérieur, les fruits ne deviennent visibles à l'extérieur qu'ensuite. La Bible est pleine de leçons sur la façon dont nous pouvons (dans notre cœur) ressembler davantage à Jésus.</p>
  jong_faq4_title: Inscription
  jong_faq4_body: <p>L'inscription est possible jusqu'au 14 juin 2026. La participation est soumise à l'acceptation du règlement du camp. Une fois le formulaire rempli et le paiement reçu, ton inscription est complète. Tu ne recevras pas de confirmation par e-mail.</p>
  jong_faq5_title: Le paiement
  jong_faq5_body: '<p>Le coût s''élève à € 110 et doit être versé au plus tard le 1 juillet 2026 sur le compte Jong° :</p><p><strong>NL48 ABNA 0246 4532 22</strong> au nom de Jong°<br>Avec la mention : Ton nom + SummerCamp 2026</p><p>Deux versements sont aussi possibles : € 50 avant le 1 juin et € 60 avant le 1 juillet. En cas d''annulation après le 1 juillet, nous facturons la moitié des frais de camp.</p>'
  jong_faq6_title: Le règlement du camp
  jong_faq6_body: <p>Camp non-fumeur et sans alcool. Assure-toi d'être toi-même assuré (attention à l'assurance à l'étranger). N'oublie pas ta pièce d'identité. Mieux vaut laisser les objets de valeur à la maison. L'usage du GSM, de la tablette ou de la console de jeux n'est pas souhaité un petit message à ta maman est bien sûr permis.</p>
  jong_cta: S'inscrire au Summer Camp
  realmen_kicker: Hommes à partir de 16 ans
  realmen_title: Real Men Camp
  realmen_tagline: Encouragés, stimulés et éveillés
  realmen_when_value: 11 – 13 septembre
  realmen_cost_value: € 100
  realmen_who_value: Hommes à partir de 16 ans
  realmen_location_value: Domaine du Bocq, Purnode
  realmen_stay_value: Camping & tentes
  realmen_intro: 'Un week-end pour les hommes d''Open Kerk et d''ailleurs. Que tu sois là depuis des années ou que tu viennes juste voir : tu es le bienvenu tel que tu es. Pas d''histoires parfaites, mais des vraies. Sur la foi, le combat, les chutes et les relèvements, et suivre Jésus dans la vie réelle. Tu n''es pas seul.'
  realmen_faq1_title: À quoi puis-je m'attendre ?
  realmen_faq1_body: '<p>De vraies histoires, de bonnes conversations près du feu, des activités et de l''aventure, des repas et de la fraternité. Il s''agit de bien plus que de convivialité : grandir ensemble, être stimulés ensemble et chercher Jésus ensemble.</p>'
  realmen_faq2_title: Pour qui est-ce ?
  realmen_faq2_body: <p>Pour tous les hommes à partir de 16 ans. Avec beaucoup de foi ou avec des questions, présents depuis des années ou se joignant pour la première fois. Viens non pas parce que tout est en ordre, mais justement parce que nous avons besoin de Jésus.</p>
  realmen_faq3_title: Je ne connais pas encore beaucoup d'hommes. Gênant ?
  realmen_faq3_body: '<p>Peut-être un instant et ça ira. C''est justement en venant que tu apprends à connaître les hommes : pendant les repas, près du feu, en chemin ou simplement entre-temps. Tu n''as pas besoin d''être le plus bruyant. Viens simplement, participe.</p>'
  realmen_faq4_title: Coucher & hébergement
  realmen_faq4_body: <p>Nous dormons dans des tentes déjà montées pour toi apporte ton propre matelas (gonflable) ou lit de camp. Tu préfères plus de confort ? Réserve à tes frais une tente glamping, ou organise toi-même un Airbnb/hôtel à proximité. Tu peux aussi venir uniquement le samedi et dormir chez toi. Indique ton choix sur le formulaire.</p>
  realmen_faq5_title: Début & fin
  realmen_faq5_body: <p>Vendredi 11 septembre à partir de 16h00 (pas plus tôt le terrain n'est pas encore disponible). Rejoindre plus tard pour cause de travail ou d'études est permis. Le dimanche 13 septembre, nous terminons à 08h00 et roulons directement vers le culte à Lommel.</p>
  realmen_faq6_title: Le paiement
  realmen_faq6_body: '<p>Le coût s''élève à € 100 (repas, activités et hébergement compris) et doit être versé au plus tard le 1 septembre au nom d''Open Kerk :</p><p><strong>NL:</strong> NL55 ABNA 0528 2626 37<br><strong>BE:</strong> BE88 7352 1819 7141<br>Avec la mention : Ton nom + Real Men 2026</p><p>Open Kerk ne fonctionne jamais avec un but lucratif le montant couvre exactement les coûts du week-end.</p>'
  realmen_cta: S'inscrire au Real Men Camp
