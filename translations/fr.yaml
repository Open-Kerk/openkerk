nieuwbouw:
  page_title: Nouvelle construction OPEN. Kerk
  hero_heading: Projet de construction Open Kerk
  hero_subtitle: De la place pour grandir aujourd'hui et pour <span class="underline">les générations à venir.</span>
  waarom_heading: Pourquoi nous allons construire
  waarom_p1: Open Kerk est présente à Lommel depuis 1983. Ce qui a commencé comme une petite église de maison est devenu une église accueillant des centaines de visiteurs le dimanche. Nous sommes reconnaissants pour cette croissance – mais dans notre bâtiment, nous nous heurtons désormais littéralement à ses limites.
  waarom_p2: 'La salle de culte est régulièrement comble et les espaces de l''église des enfants sont structurellement trop petits. En même temps, de plus en plus de personnes, de Lommel et de la région élargie, trouvent leur chemin vers Open Kerk. C''est pourquoi nous investissons dans un bâtiment durable sur la Saskesdreef : un seul lieu où la Parole de Dieu reste centrale, avec suffisamment d''espace pour les cultes, l''Église des enfants et les rencontres – également pour les générations après nous.'
  video_fallback: Votre navigateur ne prend pas en charge cette vidéo.
  stap_heading: Construit étape par étape
  stap_p1: Open Kerk est établie sur la Saskesdreef depuis des années. D'abord, le bâtiment existant a été rénové, puis sont venus la salle de culte actuelle et les places de parking. Fin 2023 est née la vision de rénover et d'agrandir profondément le terrain.
  stap_p2: Deux parcelles boisées adjacentes ont été achetées et intégrées au plan de construction de l'espace pour des places de parking supplémentaires, une aire de jeux et la rétention des eaux pluviales sur le terrain. En 2024, Buro-B Architecten de Genk a élaboré le plan ; le permis de construire a été accordé et est définitif. Nous pouvons donc réellement commencer à construire.
  fases_heading: Construire en 4 phases
  fases_intro: Le projet de construction est volontairement échelonné. Ainsi, nous construisons étape par étape, continuons à accueillir les visiteurs au même endroit et donnons au financement une forme responsable.
  fase1_num: Phase 1
  fase1_title: Une nouvelle église des enfants
  fase1_desc: Suffisamment de salles pour les différents groupes d'âge, une bonne acoustique et des espaces sûrs et clairs, directement reliés au reste du bâtiment. Aussi une nouvelle cuisine et des sanitaires. Pas un "joli petit coin", mais une place à part entière au cœur de l'église.
  fase1_plan: 'Planning : premier semestre 2026'
  fase2_num: Phase 2
  fase2_title: Nouvelle salle de culte
  fase2_desc: La partie ancienne sera démolie et remplacée par une nouvelle salle de culte plus grande. La salle actuelle (2013) reste en place et devient le "maillon" entre la salle de culte, l'église des enfants et l'espace polyvalent. Plus de places, de bonnes lignes de vue, une acoustique et une technique adaptées aux cultes, aux baptêmes et aux rassemblements particuliers.
  fase3_num: Phase 3
  fase3_title: Entrée & salle polyvalente
  fase3_desc: 'La salle de culte existante recevra une façade en verre et deviendra la nouvelle entrée et l''espace de liaison. L''autre moitié deviendra un espace de rencontre polyvalent : église des jeunes et activités pour adolescents, mariages et services funèbres, soirées de communauté, cours et conférences.'
  fase4_num: Phase 4
  fase4_title: Réaménagement du terrain extérieur
  fase4_desc: Un espace de stationnement supplémentaire et mieux organisé, des cheminements sûrs pour les enfants et les parents, des espaces verts et de jeu, et des installations pour la rétention des eaux pluviales. Grâce aux nouvelles parcelles, le terrain reste spacieux et vert, avec beaucoup d'espace ouvert.
  kinderkerk_meta: Phase 1 · premier semestre 2026
  kinderkerk_heading: Une maison pour les enfants
  kinderkerk_p1: Au rez-de-chaussée se trouveront des blocs sanitaires "airport-style", une cuisine et des espaces pour enfants. Au premier étage, des toilettes pour enfants, des espaces pour enfants et une salle d'entretien. Vers la fin de l'été 2026, les enfants déménageront en fête de l'ancien vers le nouveau bâtiment.
  tijdlijn_heading: Chronologie
  tl1_jaar: '1983'
  tl1_titel: Début comme église de maison à Eersel
  tl1_tekst: Cees & Agnès Laurey lancent l'église depuis leur salon. Bientôt trop petit ; l'église grandissante utilise des maisons de village dans la Campine.
  tl2_jaar: '2004'
  tl2_titel: Location et rénovation de la Saskesdreef 10
  tl2_tekst: Après une longue recherche et beaucoup de prière, l'église peut louer le bâtiment de "Lenteleven". Par un effort commun, il est entièrement rénové.
  tl3_jaar: '2009'
  tl3_titel: Achat du bâtiment
  tl3_tekst: Après 5 ans de location, l'église achète le bâtiment, financé en grande partie par des dons et en partie par un emprunt hypothécaire.
  tl4_jaar: '2013'
  tl4_titel: Construction de la salle de culte actuelle
  tl4_tekst: L'ancienne salle accueillait environ 100 visiteurs. La nouvelle salle, achevée par l'église elle-même, accueille 300 visiteurs.
  tl5_jaar: '2016'
  tl5_titel: Tim & Vanessa Laurey deviennent pasteurs
  tl5_tekst: Les fondateurs Cees & Agnès prennent leur retraite ; leur fils Tim et son épouse Vanessa deviennent les pasteurs d'Open Kerk.
  tl6_jaar: '2023'
  tl6_titel: Vision d'agrandissement
  tl6_tekst: Chaque dimanche, environ 300 adultes et 80 enfants. Les espaces semblent pleins ; Dieu pousse la direction vers l'agrandissement.
  tl7_jaar: '2024'
  tl7_titel: Achat des parcelles & permis de construire
  tl7_tekst: Deux parcelles boisées adjacentes sont achetées en moins d'un mois. Buro-B Architecten conçoit la nouvelle construction ; le permis est approuvé sans objection. Les feux passent au vert.
  tl8_jaar: '2026'
  tl8_titel: 'Phase 1 : construction de l''Église des enfants'
  tl8_tekst: Construction de l'église des enfants et d'une "route de chantier" avec des places de parking ultérieures. Au cours du second semestre, les enfants déménagent vers le nouveau bâtiment.
  tl9_jaar: Plus tard
  tl9_titel: Phases 2, 3 & 4
  tl9_tekst: Nouvelle salle, entrée vitrée, espace polyvalent et terrain extérieur avec 160 places de parking, en partie pour les personnes à mobilité réduite et avec des bornes de recharge.
  fin_meta: Une gestion responsable
  fin_heading: Comment nous souhaitons financer cela
  fin_p1: En tant qu'église, nous voulons gérer l'argent de manière responsable. Ce projet est possible parce qu'Open Kerk elle-même y contribue de façon importante grâce aux dons et aux réserves, et parce que les visiteurs réguliers et les personnes impliquées prêtent et/ou donnent.
  fin_p2: Nous optons pour un mélange de moyens propres, de prêts au sein de notre propre cercle et restons ouverts à des prêts externes, avec un plan de remboursement réaliste à long terme. Ainsi, nous rendons justice à la gestion responsable et à l'appel à bâtir, dans cette région, une maison de prière, d'enseignement et de communauté.
  voorwie_heading: Pour qui est ce projet de construction ?
  voorwie_p1: Ce projet n'existe pas "pour le bâtiment lui-même", mais pour des personnes pour des enfants et des jeunes qui, dans un environnement sûr et spacieux, apprennent ce que signifie suivre Jésus ; pour des familles et des personnes seules qui servent Dieu ensemble et se rencontrent ; pour la région de Lommel et ses environs ; et pour les générations futures nos enfants et leurs enfants.
  voorwie_p2: Nous voyons ce bâtiment comme un moyen d'édifier l'Église du Christ, en bonne entente avec les autres églises et communautés de foi de la ville.
  betrokken_heading: Comment vous pouvez vous impliquer
  betrokken_p1_before: Nous sommes reconnaissants envers tous ceux qui soutiennent ce projet à l'intérieur et à l'extérieur de notre église. Prier ensemble pour la sagesse, la protection et le fruit spirituel.
  betrokken_link_geven: Donner
  betrokken_p1_after: via les canaux habituels d'Open Kerk, avec la mention "Projet de construction". Réfléchir avec nous si vous connaissez quelqu'un qui peut aider à financer ce projet par un prêt. Dès qu'il y aura des étapes importantes, nous les partagerons sur cette page et via notre application d'église.
