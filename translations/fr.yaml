home:
  title: OPEN. Kerk — Ouvert à Dieu, ouvert à toi.
  hero_title: Ouvert à Dieu,<br>ouvert à toi.
  hero_subtitle: 'L''église est une maison de prière. Jésus a dit : ‘Mon temple sera appelé une maison de prière pour toutes les nations.’ Notre but est de créer un lieu de la présence de Dieu en Le cherchant'
  hero_subtitle_underline: dans l'adoration et la prière.
  hero_button: Rejoins-nous
  who_we_are_title: Qui sommes-nous
  who_we_are_body: Open Kerk est une communauté évangélique à Lommel, en Belgique, fondée en 1983 comme une petite église de maison et devenue une communauté chaleureuse de centaines de personnes qui se rassemblent chaque semaine. Un lieu où tu es le bienvenu tel que tu es, où la foi et la vie ne sont pas séparées l'une de l'autre, et où les gens veillent les uns sur les autres. Nous croyons que Dieu est bon et que la vie fonctionne le mieux lorsque nous la vivons comme Il l'a voulue. Non comme une obligation, mais comme une invitation. Chaque dimanche à 10h30. Ouvert à Dieu, ouvert à toi.
  believe_section_title: Que signifie croire en Dieu ?
  belief_1_title: Dieu est amour
  belief_1_body: La chose la plus importante qu'une personne puisse savoir au sujet de Dieu, c'est qu'Il est bon. Tu peux Lui faire confiance, ainsi qu'à Sa Parole. Dieu a tout créé et aime Sa création. Il est préférable pour toi et pour moi de vivre à Sa manière. C'est pourquoi il est bon de réaliser que Dieu t'aime et veut le meilleur pour toi.
  belief_2_title: Jésus est Dieu
  belief_2_media_title: Jésus est Dieu
  belief_2_body: La Bible décrit comment Dieu Lui-même s'est fait Homme pour rétablir l'amitié entre Dieu et les hommes. Par notre liberté, nous avons fait, à côté de beaucoup de bonnes choses, aussi beaucoup de mauvaises choses. La Bible appelle cela le péché, et par le péché l'amitié entre Dieu et les hommes a été brisée. Jésus l'a rétablie en montrant et en enseignant comment une personne peut vivre en tant qu'enfant de Dieu. Jésus est mort pour tes péchés et les miens sur une croix, mais Il est ressuscité d'entre les morts. En croyant en Lui, toi et moi recevons une nouvelle vie ; la vraie vie, libérée du péché et en amitié avec Dieu !
  belief_3_title: La Bible est la Parole de Dieu
  belief_3_body: La Bible énonce la Parole et la Vérité éternelles. Un chrétien suit scrupuleusement la parole de Dieu. Cette obéissance permet une vie avec Dieu, dans l'espérance et la paix.
  belief_4_title: Jésus nous demande de Le suivre
  belief_4_body: 'Jésus a dit un jour : "N''écoute pas seulement ce que Je dis, mais fais-le aussi." Lorsque tu fais ce que Jésus dit dans Sa Parole, tu Lui ressembles davantage et tu es une bénédiction non seulement pour toi-même mais aussi pour le monde qui t''entoure.'
  belief_5_title: Père, Fils et Saint-Esprit
  belief_5_body: Dieu est un. Il est le Créateur de tout ce qui existe et le Seigneur de la création. Dieu est un Père parce qu'Il nous crée, nous guide et nous protège. Dieu est le Fils parce qu'Il s'est fait homme pour rétablir l'amitié entre Lui et nous. Dieu est le Saint-Esprit qui habite en tous ceux qui croient en Lui.
  leaders_title: Rencontrez nos responsables
  leaders_subtitle: Voici les pasteurs qui nous accompagnent dans notre discipulat.
  leader_1_name: Tim Laurey
  leader_1_role: Pasteur d'OpenKerk.
  leader_2_name: Vanessa Laurey
  leader_2_role: Pasteur d'OpenKerk.
activiteiten:
  page_title: Activités — OPEN. Kerk
  hero_heading: Qu'y a-t-il à<br><span class="underline">faire à l'église ?</span>
  hero_subtitle: Chaque semaine, il y a beaucoup à vivre à Open Kerk.<br>Du culte du dimanche aux lifegroups, à la prière et aux camps —<br>il y a une place pour toi.
  intro_title: Toutes les activités d'Open. Kerk
  intro_text: Une église vivante se rassemble — pas seulement le dimanche, mais tout au long de la semaine. Ci-dessous, tu trouveras tout ce qui se passe. Télécharge notre application pour les dernières mises à jour, horaires et lieux.
  kerkdienst_meta: Chaque dimanche · 10:30 – 12:30u
  kerkdienst_title: Culte
  kerkdienst_desc: Chaque dimanche à 10.30u. Donne-toi une année entière pour venir à l'église chaque semaine. Apprends à connaître Dieu. Et découvre comment tout commence à s'améliorer.
  kinderkerk_meta: Chaque dimanche · 10:30 – 12:30u
  kinderkerk_title: Église des enfants
  kinderkerk_desc: Pendant que les grands profitent du culte habituel, les enfants ne doivent évidemment pas être laissés de côté. C'est pourquoi il est si agréable de savoir qu'il existe une super OPEN. Église des enfants où chaque enfant est le bienvenu. Tout est conçu pour faire découvrir Dieu aux enfants.
  jong_meta: 2× par mois · vendredi soir
  jong_title: Jong°
  jong_desc: Jongº est le groupe de jeunes d'OPEN Kerk. Deux fois par mois, le vendredi soir, ils se réunissent pour une soirée conviviale. Ils partagent un seul objectif… celui de mieux connaître Jésus, personnellement et en groupe. Vivre avec Dieu, c'est passionnant… cela semble familier… et nous apprend qui nous sommes vraiment.
  gebed_meta: Chaque lundi · 19:30 – 21:00u
  gebed_title: Prière et adoration
  gebed_desc: Chaque lundi soir, nous nous réunissons à Open. Kerk pour adorer Dieu et prier ensemble. Tout le monde est invité à participer. Le dernier jeudi de chaque mois, nous tenons une soirée d'Intercession, où nous prions non pour nous-mêmes mais pour les autres.
  lifegroups_meta: Chaque mois
  lifegroups_title: Lifegroups
  lifegroups_desc: Une fois par mois, nous nous réunissons en petits groupes pour partager un bon repas et parler de la foi. Grâce à ces groupes, tu noues de vraies amitiés et tu grandis dans ta relation avec Dieu.
  realmen_meta: Chaque mois
  realmen_title: Real Men
  realmen_desc: Une fois par mois, des hommes se réunissent en petits groupes pour parler de la foi, tisser des amitiés et s'encourager mutuellement.
  vrouwen_meta: 2× par an
  vrouwen_title: Soirée des femmes
  vrouwen_desc: Deux fois par an, un vendredi soir est consacré spécialement aux femmes. Ces soirées ont lieu à Open. Kerk et sont si agréables et édifiantes que tu ne voudras vraiment pas les manquer !
  nieuwestart_meta: 2× par an · 4 mercredis
  nieuwestart_title: Nouveau départ
  nieuwestart_desc: Deux fois par an, tu peux t'inscrire au Nouveau Départ. Au cours de 4 mercredis soir, nous abordons les bases de la foi en Jésus. Inscris-toi pour participer au prochain nouveau départ.
  kampen_meta: Chaque année · vacances d'été
  kampen_title: Camps d'été
  kampen_desc: Chaque année, nous organisons des camps d'été pour les enfants et les jeunes pendant les vacances d'été. Pour les hommes d'Open. Kerk, nous organisons en septembre un week-end d'aventure dans les Ardennes.
  app_title: Reste informé
  app_text: Nous communiquons toutes les activités dans l'application Open. Kerk. Tu peux la télécharger à l'aide du code QR qui apparaît régulièrement à l'écran pendant les cultes d'Open. Kerk.
live:
  page_title: Live — OPEN. Kerk
  hero_heading: <span class="underline">Live</span>
  hero_subtitle: Tu ne peux pas être présent ? Suis-nous en direct.<br>Chaque dimanche à 10:30.
  hero_button: Voir le direct
  stream_title: Le culte d'aujourd'hui
  stream_text: Chaque dimanche à 10:30u, nous diffusons le culte en direct. Rejoins-nous depuis chez toi ou revois un culte précédent.
  offline_status: Il n'y a pas de diffusion pour le moment
  offline_text: Le prochain direct aura lieu dimanche prochain à 10:30u. D'ici là, tu peux revoir les cultes précédents.
  offline_link: Voir les cultes précédents
  welcome_title: Tu es le bienvenu
  welcome_text: Il est important que tu te sentes chez toi et que tu sois présent autant que possible. Suivre en ligne, c'est bien, mais tu es bien sûr aussi chaleureusement invité à venir nous rendre visite à Lommel. Ouvert pour Dieu, ouvert pour toi.
