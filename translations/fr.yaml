  doelstelling_heading: Objectif
  doelstelling_p1: OPEN. Kerk est une église protestante évangélique. Nous croyons en Jésus-Christ ; Dieu et Sauveur de tous les hommes sur la terre. Nous nous rassemblons en tant que croyants pour honorer Dieu le Père, au nom de Jésus-Christ notre Sauveur, et œuvrons, inspirés par le Saint-Esprit, à accomplir les bonnes œuvres de l'église de Jésus-Christ dans la région de la Kempen. Le but de notre église est d'informer les gens de notre région qu'il existe un Dieu qui les aime — et de montrer que Jésus-Christ est vivant et que vivre selon Ses commandements offre en résultat une vie de bénédiction et d'abondance.
  doelstelling_p2: Toutes nos activités reposent sur cette bonne cause. L'église enseigne à ses visiteurs l'amour de Jésus, chante des cantiques pour honorer Dieu le Père, et donne aux enfants, d'une manière ludique et pédagogique, la conscience que Dieu est toujours là pour eux. Elle donne aux pauvres et offre de l'aide aux personnes dans les différents besoins de cette vie — dans la maladie, le chagrin et les problèmes personnels. L'église est également active dans le domaine du travail auprès des jeunes, afin que les jeunes puissent se développer dans leur future position dans la société en tant qu'enfant de Dieu.
  doelstelling_p3: En bref, l'église aspire à ce que tous les hommes vivent dans l'amour, la grâce et la protection de Jésus-Christ, notre Dieu.
