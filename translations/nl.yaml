  intro_heading: Welkom in het predikingenarchief
  intro_body: "Hier verzamelen we elke preek van OPEN. Kerk zodat je ze later opnieuw kunt beluisteren vanaf elk moment in de video, doorzoekbaar op woord of passage, en met ondertiteling in vier talen (Nederlands, Engels, Frans en Spaans). Of je nu een onderwerp wilt nakijken, een vriend in een andere taal wilt laten meekijken, of gewoon een dienst hebt gemist: alles staat klaar om terug te kijken."
