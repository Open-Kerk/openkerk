anbi:
  title: ANBI
  hero_heading: <span class="underline">ANBI</span>
  hero_subtitle: OPEN. Kerk heeft een geregistreerde ANBI-status.<br>Hier vind je onze gegevens, ons bestuur en onze verantwoording.
  doelstelling_heading: Doelstelling
  doelstelling_p1: OPEN. Kerk is een protestants evangelische kerk. Wij geloven in Jezus Christus; God en Verlosser van alle mensen op aarde. Wij komen samen als gelovigen om God de Vader te eren, in de naam van Jezus Christus onze Redder, en werken geïnspireerd door de Heilige Geest om de goede werken van de kerk van Jezus Christus uit te voeren in het gebied de Kempen. Het doel van onze kerk is om de mensen in onze regio te informeren dat er een God is die van hen houdt en om te laten zien dat Jezus Christus leeft en dat het leven naar Zijn geboden een leven van zegen en overvloed als resultaat biedt.
  doelstelling_p2: Al onze werkzaamheden zijn gebaseerd op dit goede doel. De kerk onderwijst haar bezoekers over de liefde van Jezus, zingt liederen om God de Vader te eren, en geeft de kinderen op een speelse pedagogische wijze het bewustzijn dat God er altijd voor hen is. Zij geeft aan de armen en biedt hulp aan mensen in de verschillende noden van dit leven in ziekte, verdriet en persoonlijke problemen. Ook is de kerk actief op het gebied van jeugdwerk, zodat jongeren zich kunnen ontwikkelen in hun toekomstige positie in de maatschappij als kind van God.
  doelstelling_p3: Kortom, de kerk streeft ernaar dat alle mensen leven in de liefde, genade en bescherming van Jezus Christus, onze God.
