nieuwbouw:
  page_title: Nieuwbouw OPEN. Kerk
  hero_heading: Bouwproject Open Kerk
  hero_subtitle: Ruimte voor groei nu en voor de <span class="underline">volgende generaties.</span>
  waarom_heading: Waarom we gaan bouwen
  waarom_p1: Open Kerk is sinds 1983 aanwezig in Lommel. Wat begon als een kleine huiskerk, is uitgegroeid tot een kerk met honderden bezoekers op zondag. We zijn dankbaar voor die groei – maar in ons gebouw lopen we inmiddels letterlijk tegen zijn grenzen aan.
  waarom_p2: 'De kerkzaal zit regelmatig vol en de kinderkerkruimtes zijn structureel te klein. Tegelijk vinden steeds meer mensen, uit Lommel en de wijde omgeving, hun weg naar Open Kerk. Daarom investeren we in een toekomstbestendig gebouw aan de Saskesdreef: één locatie waar het Woord van God centraal blijft staan, met voldoende ruimte voor erediensten, Kinderkerk en ontmoetingen – ook voor de generaties na ons.'
  video_fallback: Je browser ondersteunt deze video niet.
  stap_heading: Stap voor stap gebouwd
  stap_p1: Open Kerk is al jaren gevestigd aan de Saskesdreef. Eerst werd het bestaande gebouw gerenoveerd, daarna kwamen de huidige kerkzaal en parkeerplaatsen. Eind 2023 ontstond de visie om het terrein grondig te vernieuwen en uit te breiden.
  stap_p2: Twee aangrenzende bospercelen werden aangekocht en opgenomen in het bouwplan ruimte voor extra parkeerplaatsen, speelruimte en hemelwaterberging op eigen terrein. In 2024 werkte Buro-B Architecten uit Genk het plan uit; de bouwvergunning is verleend en definitief. We kunnen dus daadwerkelijk gaan bouwen.
  fases_heading: Bouwen in 4 fases
  fases_intro: Het bouwproject is bewust gefaseerd. Zo bouwen we stap voor stap, blijven we bezoekers op dezelfde locatie ontvangen en geven we de financiering verantwoord vorm.
  fase1_num: Fase 1
  fase1_title: Een nieuwe kinderkerk
  fase1_desc: Voldoende zalen voor de verschillende leeftijdsgroepen, goede akoestiek en veilige, overzichtelijke ruimtes, met directe aansluiting op de rest van het gebouw. Ook een nieuwe keuken en sanitair. Geen "mooi hoekje", maar een volwaardige plek in het hart van de kerk.
  fase1_plan: 'Planning: eerste helft 2026'
  fase2_num: Fase 2
  fase2_title: Nieuwe kerkzaal
  fase2_desc: Het oude deel wordt gesloopt en vervangen door een nieuwe, grotere kerkzaal. De huidige zaal (2013) blijft staan en wordt de "schakel" tussen kerkzaal, kinderkerk en polyvalente ruimte. Meer plaatsen, goede zichtlijnen, akoestiek en techniek geschikt voor erediensten, doopdiensten en bijzondere samenkomsten.
  fase3_num: Fase 3
  fase3_title: Entree & multifunctionele zaal
  fase3_desc: 'De bestaande kerkzaal krijgt een glazen gevel en wordt de nieuwe entree en verbindingsruimte. De andere helft wordt een multifunctionele ontmoetingsruimte: jeugdkerk en tieneractiviteiten, huwelijken en rouwdiensten, gemeenteavonden, cursussen en conferenties.'
  fase4_num: Fase 4
  fase4_title: Herinrichting buitenterrein
  fase4_desc: Extra en beter georganiseerde parkeerruimte, veilige looproutes voor kinderen en ouders, groenvoorziening en speelruimte, en voorzieningen voor hemelwaterberging. Dankzij de nieuwe percelen blijft het terrein ruim en groen, met veel open ruimte.
  kinderkerk_meta: Fase 1 · eerste helft 2026
  kinderkerk_heading: Een huis voor de kinderen
  kinderkerk_p1: Op de begane grond komen "airport-style" toiletgroepen, een keuken en kinderruimtes. Op de eerste verdieping toiletten voor kinderen, kinderruimtes en een spreekkamer. Tegen het einde van de zomer 2026 verhuizen de kinderen feestelijk van het oude naar het nieuwe gebouw.
  tijdlijn_heading: Tijdlijn
  tl1_jaar: '1983'
  tl1_titel: Start als huiskerk in Eersel
  tl1_tekst: Cees & Agnès Laurey starten de kerk vanuit hun huiskamer. Al snel te klein; de groeiende kerk gebruikt dorpshuizen in de Kempen.
  tl2_jaar: '2004'
  tl2_titel: Huur en renovatie Saskesdreef 10
  tl2_tekst: Na lang zoeken en veel gebed kan de kerk het gebouw van "Lenteleven" huren. Met vereende krachten wordt het grondig gerenoveerd.
  tl3_jaar: '2009'
  tl3_titel: Aankoop gebouw
  tl3_tekst: Na 5 jaar huren koopt de kerk het gebouw, grotendeels gefinancierd uit giften en deels via een hypotheek.
  tl4_jaar: '2013'
  tl4_titel: Bouw van de huidige kerkzaal
  tl4_tekst: De oude zaal bood plaats aan ±100 bezoekers. De nieuwe zaal, zelf afgewerkt door de kerk, biedt plaats aan 300 bezoekers.
  tl5_jaar: '2016'
  tl5_titel: Tim & Vanessa Laurey worden pastors
  tl5_tekst: Oprichters Cees & Agnès gaan met emeritaat; zoon Tim en zijn vrouw Vanessa worden voorgangers van Open Kerk.
  tl6_jaar: '2023'
  tl6_titel: Visie voor uitbreiding
  tl6_tekst: Elke zondag ±300 volwassenen en 80 kinderen. De ruimtes voelen vol; God dringt bij de leiding aan op uitbreiding.
  tl7_jaar: '2024'
  tl7_titel: Aankoop percelen & bouwvergunning
  tl7_tekst: Twee aangrenzende bospercelen worden binnen een maand gekocht. Buro-B Architecten ontwerpt de nieuwbouw; de vergunning wordt zonder bezwaar goedgekeurd. De lichten gaan op groen.
  tl8_jaar: '2026'
  tl8_titel: 'Fase 1: bouw van de Kinderkerk'
  tl8_tekst: Bouw van de kinderkerk en een "bouwweg" met latere parkeervakken. In de tweede helft van het jaar verhuizen de kinderen naar het nieuwe gebouw.
  tl9_jaar: Later
  tl9_titel: Fases 2, 3 & 4
  tl9_tekst: Nieuwe zaal, glazen entree, multifunctionele ruimte en buitenterrein met 160 parkeerplaatsen, deels voor minder validen en met laadpalen.
  fin_meta: Verantwoord rentmeesterschap
  fin_heading: Hoe we dit willen financieren
  fin_p1: Als kerk willen we verantwoord omgaan met geld. Dit project is mogelijk doordat Open Kerk zelf aanzienlijk bijdraagt vanuit giften en reserves, en doordat vaste bezoekers en betrokkenen lenen en/of geven.
  fin_p2: We kiezen voor een mix van eigen middelen, leningen uit eigen kring en staan open voor externe leningen, met een realistisch aflossingsplan op lange termijn. Zo doen we recht aan rentmeesterschap én aan de roeping om in deze regio te bouwen aan een huis van gebed, onderwijs en gemeenschap.
  voorwie_heading: Voor wie is dit bouwproject?
  voorwie_p1: Dit project is er niet "voor het gebouw zelf", maar voor mensen voor kinderen en jongeren die in een veilige, ruime omgeving leren wat het betekent om Jezus te volgen; voor gezinnen en alleenstaanden die samen God dienen en elkaar ontmoeten; voor de regio Lommel en omstreken; en voor toekomstige generaties onze kinderen en hun kinderen.
  voorwie_p2: We zien dit gebouw als een middel om Christus' kerk op te bouwen, in goede verstandhouding met andere kerken en geloofsgemeenschappen in de stad.
  betrokken_heading: Hoe je betrokken kunt zijn
  betrokken_p1_before: We zijn dankbaar voor iedereen die meeleeft met dit project binnen en buiten onze kerk. Meebidden om wijsheid, bescherming en geestelijke vrucht.
  betrokken_link_geven: Meegeven
  betrokken_p1_after: via de gebruikelijke kanalen van Open Kerk, met vermelding "Bouwproject". Meedenken als je iemand kent die dit project via een lening mee kan financieren. Zodra er belangrijke mijlpalen zijn, delen we die op deze pagina en via onze kerk-app.
  betrokken_contact: Neem contact op
kampen:
  page_title: Kampen OPEN. Kerk
  hero_heading: Samen op <span class="underline">kamp</span>
  hero_subtitle: Elk jaar trekken we erop uit voor kinderen, jongeren en mannen.<br>Dagen vol geloof, vriendschap en avontuur.
  hero_button: Bekijk de kampen
  intro_heading: Drie kampen, één doel
  intro_paragraph: 'Of je nu 6 of 60 bent er is een kamp voor jou. Kies hieronder een kamp om alle details te zien: data, kosten, thema en antwoorden op je vragen.'
