home:
  title: OPEN. Kerk Open voor God, open voor jou.
  hero_title: Open voor God,<br>open voor jou.
  hero_subtitle: De kerk is een huis van gebed. Jezus zei, ‘Mijn tempel zal een gebedshuis voor alle volken worden genoemd.’ Het is ons doel om een plaats van de aanwezigheid voor God te maken door Hem te zoeken
  hero_subtitle_underline: in aanbidding en gebed.
  hero_button: Doe mee
  who_we_are_title: Wie zijn wij
  who_we_are_body: Open Kerk is een Evangelische gemeente in Lommel, België gestart in 1983 als een kleine huiskerk en uitgegroeid tot een warme gemeenschap van honderden mensen die elke week samenkomen. Een plek waar je welkom bent zoals je bent, waar geloof en leven niet van elkaar gescheiden zijn, en waar mensen naar elkaar omzien. We geloven dat God goed is en dat het leven het beste werkt wanneer we het leven zoals Hij het bedoeld heeft. Niet als een verplichting, maar als een uitnodiging. Elke zondag om 10:30u. Open voor God, open voor jou.
  believe_section_title: Wat betekent het om in God te geloven?
  belief_1_title: God is liefde
  belief_1_body: Het belangrijkste dat een mens over God moet weten is dat Hij goed is. Je kunt op Hem en Zijn Woord vertrouwen. God heeft alles gemaakt en houdt van Zijn schepping. Het is voor jou en mij het beste om op Zijn manier te gaan leven. Het is daarom goed om te beseffen dat God van jou houdt en het beste met je voor heeft. Gods liefde is niet afhankelijk van wat jij presteert of hoe goed je het doet. Hij kent je volledig, met al je sterke en zwakke kanten, en toch kiest Hij ervoor om van je te houden. Door de hele Bijbel heen zien we een God die mensen opzoekt, vergeeft, herstelt en uitnodigt om dicht bij Hem te leven. Zijn liefde geeft hoop, rust en een stevig fundament voor het leven.
  belief_2_title: Jezus is God
  belief_2_media_title: Jezus is God
  belief_2_body: De Bijbel beschrijft dat God zelf een Mens werd om de vriendschap tussen God en de mensen te herstellen. Door onze vrijheid hebben we naast veel goede dingen, ook veel slechte dingen gedaan. De Bijbel noemt dit zonde en door de zonde werd de vriendschap tussen God en mensen kapot gemaakt. Jezus heeft dit hersteld door voor te doen en te onderwijzen hoe een mens als kind van God kan leven. Jezus stierf voor jouw en mijn zonden aan een kruis, maar stond weer op uit de dood. Door in Hem te geloven krijgen jij en ik weer een nieuw leven; het échte leven, vrij van zonde en in vriendschap met God!
  belief_3_title: De Bijbel is het Woord van God
  belief_3_body: De Bijbel spreekt het eeuwige Woord en Waarheid. Een christen volgt het Woord van God nauwkeurig op. Die gehoorzaamheid zorgt voor een leven met God, in hoop en vrede. Door de Bijbel leert God ons wie Hij is en hoe wij mogen leven. Zijn Woord geeft richting in moeilijke tijden en helpt ons om goede keuzes te maken. De Bijbel is meer dan een verzameling oude verhalen; het is Gods levende boodschap voor mensen van vandaag. Wie de Bijbel leest met een open hart, ontdekt Gods liefde, wijsheid en plan voor zijn leven.
  belief_4_title: Jezus vraagt ons om Hem te volgen
  belief_4_body: 'Jezus zei ooit: "Lúister niet alleen naar wat Ik zeg, maar dóe het ook." Als je doet wat Jezus zegt in Zijn Woord, dan lijk je meer op Hem en ben je niet alleen jezelf maar ook de wereld om jou heen tot zegen. Jezus volgen betekent dat je Hem vertrouwt en Zijn voorbeeld navolgt in het dagelijks leven. Hij leert ons om God lief te hebben en onze naaste te dienen met liefde, waarheid en genade. Jezus roept mensen niet alleen op om in Hem te geloven, maar ook om als Zijn leerlingen te leven. Dat is een levenslange reis waarin we steeds meer leren denken, spreken en handelen zoals Hij. Daarbij laat Hij ons niet alleen, maar helpt Hij ons door Zijn Geest om te groeien in geloof en liefde.'
  belief_5_title: Vader, Zoon en Heilige Geest
  belief_5_body: God is één. Hij is de Schepper van alles wat bestaat en Heer over de schepping. God is een Vader omdat Hij ons maakt, leidt en beschermt. God is de Zoon omdat Hij een mens werd om de vriendschap tussen Hem en ons te herstellen. God is de Heilige Geest die in alle mensen woont die in Hem geloven. De Vader, de Zoon en de Heilige Geest zijn niet drie goden, maar één God die Zich op drie manieren aan ons bekendmaakt. Door de Heilige Geest mogen gelovigen elke dag de nabijheid, leiding en kracht van God ervaren.
  belief_6_title: De Grote Opdracht
  belief_6_body: 'Voordat Jezus terugkeerde naar de hemel, gaf Hij Zijn volgelingen een duidelijke opdracht: om het Evangelie bekend te maken en mensen te leren leven als Zijn discipelen. Deze opdracht noemen we de Grote Opdracht. Jezus roept Zijn kerk om Zijn liefde, waarheid en redding te delen met de wereld. Ook wij willen als Open Kerk onze plaats innemen in die opdracht. Hier in Lommel, in deze tijd, verlangen we ernaar dat mensen Jezus leren kennen, groeien in hun geloof en Hem gaan volgen. Daarom bouwen we aan een gemeente waar mensen God kunnen ontmoeten, toegerust worden in Zijn Woord en samen het verschil maken in hun omgeving.'
  leaders_title: Ontmoet onze leiders
  leaders_subtitle: Dit zijn de Voorgangers die ons discipelschap brengen.
  leader_1_name: Tim Laurey
  leader_1_role: Voorganger van OpenKerk.
  leader_2_name: Vanessa Laurey
  leader_2_role: Voorganger van OpenKerk.
activiteiten:
  page_title: Activiteiten OPEN. Kerk
  hero_heading: Wat is er zoal te<br><span class="underline">doen in de kerk?</span>
  hero_subtitle: Iedere week is er volop te beleven bij Open Kerk.<br>Van de zondagse dienst tot lifegroups, gebed en kampen —<br>er is een plek voor jou.
  intro_title: Alle activiteiten van Open. Kerk
  intro_text: Een levende kerk komt samen niet alleen op zondag, maar de hele week door. Hieronder vind je alles wat er te doen is. Download onze app voor de laatste updates, tijden en locaties.
  kerkdienst_meta: Elke zondag · 10:30 – 12:30u
  kerkdienst_title: Kerkdienst
  kerkdienst_desc: Iedere zondag om 10.30u. Geef jezelf een heel jaar om wekelijks naar de kerk te komen. Leer over God. En ontdek hoe alles er beter uit komt te zien.
  kinderkerk_meta: Elke zondag · 10:30 – 12:30u
  kinderkerk_title: Kinderkerk
  kinderkerk_desc: Als de grote mensen aan het genieten zijn in de gewone kerk, mogen de kinderen natuurlijk niet achterblijven. Daarom is het heel fijn om te weten dat er een supergave OPEN. Kinderkerk is waar ieder kind welkom is. Alles is erop gericht om kinderen kennis te laten maken met God.
  jong_meta: 2× per maand · vrijdagavond
  jong_title: Jong°
  jong_desc: Jongº is de jeugdgroep van OPEN Kerk. Twee keer per maand op vrijdagavond komen ze bij elkaar voor een gezellige avond. Ze hebben samen één doel… en dat is om persoonlijk en als groep, Jezus beter te leren kennen. Leven met God is exciting… voelt vertrouwd… en leert ons wie we écht zijn.
  gebed_meta: Elke maandag · 19:30 – 21:00u
  gebed_title: Gebed & Worship
  gebed_desc: Elke maandagavond komen we in Open. Kerk samen om God te aanbidden en samen te bidden. Iedereen is welkom om deel te nemen. Elke laatste donderdag van de maand hebben we een Intercession avond, waarbij we niet voor onszelf, maar voor anderen bidden.
  lifegroups_meta: Elke maand
  lifegroups_title: Lifegroups
  lifegroups_desc: Eens per maand komen we in groepjes samen om lekker te eten en daarbij te praten over het geloof. Door deze groepen bouw je echte vriendschappen op en groei je in je relatie met God.
  realmen_meta: Elke maand
  realmen_title: Real Men
  realmen_desc: Eens per maand komen mannen in kleine groepen samen om te praten over het geloof, vriendschap te bouwen en elkaar te bemoedigen.
  vrouwen_meta: 2× per jaar
  vrouwen_title: Vrouwenavond
  vrouwen_desc: Twee keer per jaar is er op een vrijdagavond een avond speciaal voor vrouwen. Deze vinden plaats in Open. Kerk en zijn zo fijn en opbouwend dat je ze echt niet wilt missen!
  nieuwestart_meta: 2× per jaar · 4 woensdagen
  nieuwestart_title: Nieuwe start
  nieuwestart_desc: Twee keer per jaar kun je je aanmelden voor de Nieuwe Start. Op 4 woensdagavonden bespreken we de basis van het geloof in Jezus. Geef je op om deel te nemen aan de volgende nieuwe start.
  kampen_meta: Jaarlijks · zomervakantie
  kampen_title: Zomerkampen
  kampen_desc: Elk jaar organiseren we zomerkampen voor de kinderen en jongeren in de zomervakantie. Voor de mannen van Open. Kerk organiseren we in september een avontuurlijk weekend in de Ardennen.
  app_title: Blijf op de hoogte
  app_text: We communiceren alle activiteiten in de app van Open. Kerk. Deze kun je downloaden met de QR-code die regelmatig op het scherm verschijnt tijdens de kerkdiensten van Open. Kerk.
live:
  page_title: Live OPEN. Kerk
  hero_heading: <span class="underline">Live</span>
  hero_subtitle: Kan je er niet bij zijn? Kijk live mee.<br>Iedere zondag om 10:30 uur.
  hero_button: Bekijk de stream
  stream_title: De dienst van vandaag
  stream_text: Iedere zondag om 10:30u zenden we de kerkdienst live uit. Sluit je vanuit huis bij ons aan of bekijk een eerdere dienst terug.
  offline_status: Op dit moment is er geen uitzending
  offline_text: De volgende livestream is aanstaande zondag om 10:30u. Tot dan kun je eerdere diensten terugkijken.
  offline_link: Bekijk eerdere diensten
  welcome_title: Jij bent welkom
  welcome_text: Het is belangrijk dat jij je thuis voelt en dat je er zo veel mogelijk bij bent. Online meekijken is fijn, maar je bent natuurlijk ook van harte welkom om langs te komen in Lommel. Open voor God, open voor jou.
