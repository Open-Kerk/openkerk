  kinder_kicker: 6 t/m 12 jaar
  kinder_title: Kinderkamp
  kinder_tagline: 'Samen één doel: Jezus ontmoeten!'
  kinder_when_value: 16 – 19 augustus
  kinder_cost_value: € 95
  kinder_who_value: Basisschool 6–12 jr
  kinder_location_value: Nieuwe Kopen 14, Lommel
  kinder_theme_value: Eerste liefde
  kinder_intro: 'Elk jaar organiseren we een prachtig kinderkamp voor kinderen van de basisschool, met één duidelijk doel: Jezus ontmoeten. De kids leren niet alleen óver Hem, maar mogen Hem ook ervaren door onderwijs, gebed, praise & worship en volop tijd om te sporten, spelen en vriendschappen te bouwen.'
  kinder_faq1_title: De doelgroep
  kinder_faq1_body: <p>Voor alle kinderen van de basisschool (vanaf 6 jaar), met of zonder christelijke achtergrond. Je bent van harte welkom!</p>
  kinder_faq2_title: De activiteiten
  kinder_faq2_body: '<p>Elke dag beginnen we met een dienst rond het thema. Daarna gaan we creatief en actief aan de slag. ''s Avonds is er een worshipdienst. Tussendoor: sport, spel, buiten zijn en lol maken.</p>'
  kinder_faq3_title: Het thema Eerste liefde
  kinder_faq3_body: <p>We houden van God omdat Hij eerst van ons hield (Joh. 3:16). In drie dagen onderzoeken we met de Bijbel hoe groot Jezus' liefde voor ons is, en wat het betekent om met heel je hart, ziel en verstand van God te houden.</p>
  kinder_faq4_title: Aanmelden
  kinder_faq4_body: <p>Aanmelden kan tot 14 juni 2026. Deelname is onder voorwaarde van acceptatie van het kampreglement. Na het invullen van het formulier én ontvangst van de betaling is de aanmelding compleet. Je krijgt geen bevestiging via mail.</p>
  kinder_faq5_title: De betaling
  kinder_faq5_body: '<p>De kosten bedragen € 95,- en dienen uiterlijk 1 juli 2026 te zijn overgemaakt op de rekening van de Kinderkerk:</p><p><strong>NL82 ABNA 0246 4531 92</strong> t.n.v. Kinderkerk<br>Onder vermelding van: Naam kind + Kinderkamp 2026</p><p>In 2 termijnen mag ook: € 50,- vóór 1 juni en € 45,- vóór 1 juli.</p>'
  kinder_cta: Aanmelden Kinderkamp
  jong_kicker: Middelbare school
  jong_title: Jong° Summer Camp
  jong_tagline: Vier dagen, één doel
  jong_when_value: 19 – 22 augustus
  jong_cost_value: € 110
  jong_who_value: Vanaf middelbare school
  jong_location_value: Nieuwe Kopen 14, Lommel
  jong_theme_value: Inside Out
  jong_intro: 'Vier dagen waarin we samen in een gezellige sfeer en met heel veel lol één doel hebben: Jezus beter leren kennen als onze Vriend, Redder en Helper. Met jeugddiensten, worship, Fun & Adventure-activiteiten en volop vrije tijd.'
  jong_faq1_title: De doelgroep
  jong_faq1_body: <p>Voor jongeren vanaf de middelbare school, met of zonder christelijke achtergrond. Ben je ouder dan 18 en wil je mee? Welkom we vragen je dan om mee te helpen met een taak.</p>
  jong_faq2_title: De activiteiten
  jong_faq2_body: '<p>Jeugddiensten met worship en thema''s waar je echt iets mee kunt in je dagelijks leven, gave Fun & Adventure-activiteiten, en vrije tijd om zowel God als je vrienden beter te leren kennen. En vooral: veel fun en gezelligheid.</p>'
  jong_faq3_title: Het thema Inside Out
  jong_faq3_body: <p>Het onderwijs gaat over onze binnenkant én buitenkant. Wanneer we van binnenuit veranderen, worden de vruchten pas aan de buitenkant zichtbaar. De Bijbel staat vol lessen hoe we (in ons hart) meer op Jezus mogen lijken.</p>
  jong_faq4_title: Aanmelden
  jong_faq4_body: <p>Aanmelden kan tot 14 juni 2026. Deelname is onder voorwaarde van acceptatie van het kampreglement. Na het invullen van het formulier én ontvangst van de betaling is je aanmelding compleet. Je krijgt geen bevestiging via mail.</p>
  jong_faq5_title: De betaling
  jong_faq5_body: '<p>De kosten bedragen € 110,- en dienen uiterlijk 1 juli 2026 te zijn overgemaakt op de Jong°-rekening:</p><p><strong>NL48 ABNA 0246 4532 22</strong> t.n.v. Jong°<br>Onder vermelding van: Je naam + SummerCamp 2026</p><p>In 2 termijnen mag ook: € 50,- vóór 1 juni en € 60,- vóór 1 juli. Bij annulering na 1 juli brengen we de helft van het kampgeld in rekening.</p>'
  jong_faq6_title: De kampregels
  jong_faq6_body: <p>Non-smoking en non-alcoholic camp. Zorg dat je zelf verzekerd bent (let op verzekering buitenland). Vergeet je ID niet. Waardevolle spullen laat je liever thuis. GSM-, tablet- of spelcomputergebruik is niet gewenst een berichtje naar je moeder mag natuurlijk wel.</p>
  jong_cta: Aanmelden Summer Camp
  realmen_kicker: Mannen vanaf 16 jaar
  realmen_title: Real Men Camp
  realmen_tagline: Bemoedigd, aangespoord en wakker
  realmen_when_value: 11 – 13 september
  realmen_cost_value: € 100
  realmen_who_value: Mannen vanaf 16 jr
  realmen_location_value: Domaine du Bocq, Purnode
  realmen_stay_value: Camping & tenten
  realmen_intro: 'Een weekend voor mannen uit Open Kerk en daarbuiten. Of je nu al jaren meedraait of net komt kijken: je bent welkom zoals je bent. Geen perfecte verhalen, wel echte. Over geloof, strijd, vallen en opstaan, en Jezus volgen in het echte leven. Je staat er niet alleen voor.'
  realmen_faq1_title: Wat kan ik verwachten?
  realmen_faq1_body: '<p>Echte verhalen, goede gesprekken bij het vuur, activiteiten en avontuur, eten en broederschap. Het gaat om meer dan gezelligheid: samen groeien, samen aangespoord worden en samen Jezus zoeken.</p>'
  realmen_faq2_title: Voor wie is het?
  realmen_faq2_body: <p>Voor alle mannen vanaf 16 jaar. Met veel geloof of met vragen, al jaren meelopend of voor het eerst aanhakend. Kom erbij niet omdat alles op orde is, maar juist omdat we Jezus nodig hebben.</p>
  realmen_faq3_title: Ik ken nog niet veel mannen. Ongemakkelijk?
  realmen_faq3_body: '<p>Misschien even en dat komt goed. Je leert mannen juist kennen door mee te gaan: tijdens het eten, bij het vuur, onderweg of gewoon tussendoor. Je hoeft niet de luidste te zijn. Kom gewoon, doe mee.</p>'
  realmen_faq4_title: Slapen & verblijf
  realmen_faq4_body: <p>We slapen in tenten die al voor je opgezet zijn neem zelf een (lucht)matras of veldbed mee. Liever comfortabeler? Boek op eigen kosten een glamping-tent, of regel zelf een Airbnb/hotel in de buurt. Je kunt ook alleen op zaterdag komen en thuis slapen. Laat je keuze weten op het formulier.</p>
  realmen_faq5_title: Begin & einde
  realmen_faq5_body: <p>Vrijdag 11 september vanaf 16.00u (niet eerder dan is het terrein nog niet beschikbaar). Later aansluiten door werk of studie mag. Zondag 13 september eindigen we om 08.00u en rijden we rechtstreeks naar de kerkdienst in Lommel.</p>
  realmen_faq6_title: De betaling
  realmen_faq6_body: '<p>De kosten bedragen € 100,- (inclusief eten, activiteiten en verblijf) en dienen uiterlijk 1 september te zijn overgemaakt t.n.v. Open Kerk:</p><p><strong>NL:</strong> NL55 ABNA 0528 2626 37<br><strong>BE:</strong> BE88 7352 1819 7141<br>Onder vermelding van: Je naam + Real Men 2026</p><p>Open Kerk werkt nooit met een verdienmodel het bedrag dekt precies de kosten van het weekend.</p>'
  realmen_cta: Aanmelden Real Men Camp
