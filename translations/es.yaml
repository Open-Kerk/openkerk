nieuwbouw:
  page_title: Nuevo edificio OPEN. Kerk
  hero_heading: Proyecto de construcción de Open Kerk
  hero_subtitle: Espacio para crecer ahora y para <span class="underline">las generaciones venideras.</span>
  waarom_heading: Por qué construimos
  waarom_p1: Open Kerk está presente en Lommel desde 1983. Lo que comenzó como una pequeña iglesia en una casa se ha convertido en una iglesia con cientos de visitantes los domingos. Estamos agradecidos por ese crecimiento, pero en nuestro edificio ahora chocamos literalmente con sus límites.
  waarom_p2: 'La sala de la iglesia se llena con regularidad y las salas de la iglesia infantil son estructuralmente demasiado pequeñas. Al mismo tiempo, cada vez más personas, de Lommel y de la región más amplia, encuentran su camino hacia Open Kerk. Por eso invertimos en un edificio preparado para el futuro en la Saskesdreef: un único lugar donde la Palabra de Dios sigue siendo central, con suficiente espacio para los cultos, la Iglesia infantil y la comunión, también para las generaciones después de nosotros.'
  video_fallback: Tu navegador no admite este vídeo.
  stap_heading: Construido paso a paso
  stap_p1: Open Kerk lleva años establecida en la Saskesdreef. Primero se renovó el edificio existente, luego se añadieron la sala de la iglesia actual y las plazas de aparcamiento. A finales de 2023 surgió la visión de renovar y ampliar a fondo el terreno.
  stap_p2: Se compraron dos parcelas boscosas adyacentes y se incluyó en el plan de construcción espacio para aparcamiento adicional, zonas de juego y almacenamiento de agua de lluvia en nuestro propio terreno. En 2024, Buro-B Architecten de Genk desarrolló el plan; el permiso de construcción ha sido concedido y es definitivo. Así que realmente podemos empezar a construir.
  fases_heading: Construcción en 4 fases
  fases_intro: El proyecto de construcción está deliberadamente dividido en fases. Así construimos paso a paso, seguimos recibiendo a los visitantes en el mismo lugar y damos forma responsable a la financiación.
  fase1_num: Fase 1
  fase1_title: Una nueva iglesia infantil
  fase1_desc: Suficientes salas para los distintos grupos de edad, buena acústica y espacios seguros y bien organizados, conectados directamente con el resto del edificio. También una nueva cocina e instalaciones sanitarias. No un "rinconcito agradable", sino un lugar de pleno derecho en el corazón de la iglesia.
  fase1_plan: 'Planificación: primer semestre de 2026'
  fase2_num: Fase 2
  fase2_title: Nueva sala de la iglesia
  fase2_desc: La parte antigua se derribará y se sustituirá por una nueva sala de la iglesia más grande. La sala actual (2013) se mantendrá y se convertirá en el "enlace" entre la sala de la iglesia, la iglesia infantil y el espacio polivalente. Más asientos, buena visibilidad, acústica y tecnología adecuadas para cultos, bautismos y reuniones especiales.
  fase3_num: Fase 3
  fase3_title: Entrada y sala multifuncional
  fase3_desc: 'La sala de la iglesia existente tendrá una fachada de cristal y se convertirá en la nueva entrada y espacio de conexión. La otra mitad se convertirá en un espacio de reunión multifuncional: iglesia juvenil y actividades para adolescentes, bodas y funerales, noches de congregación, cursos y conferencias.'
  fase4_num: Fase 4
  fase4_title: Rediseño de la zona exterior
  fase4_desc: Aparcamiento adicional y mejor organizado, rutas peatonales seguras para niños y padres, zonas verdes y de juego, e instalaciones para el almacenamiento de agua de lluvia. Gracias a las nuevas parcelas, el terreno sigue siendo amplio y verde, con mucho espacio abierto.
  kinderkerk_meta: Fase 1 · primer semestre de 2026
  kinderkerk_heading: Un hogar para los niños
  kinderkerk_p1: En la planta baja habrá bloques de aseos "estilo aeropuerto", una cocina y salas infantiles. En la primera planta, aseos para niños, salas infantiles y una sala de consulta. Hacia finales del verano de 2026, los niños se trasladarán de forma festiva del antiguo al nuevo edificio.
  tijdlijn_heading: Cronología
  tl1_jaar: '1983'
  tl1_titel: Comenzó como una iglesia en una casa en Eersel
  tl1_tekst: Cees y Agnès Laurey inician la iglesia desde su salón. Pronto se queda pequeño; la iglesia en crecimiento utiliza salas de pueblo en la región de la Campina.
  tl2_jaar: '2004'
  tl2_titel: Alquiler y renovación de Saskesdreef 10
  tl2_tekst: Tras una larga búsqueda y mucha oración, la iglesia consigue alquilar el edificio "Lenteleven". Con esfuerzos conjuntos se renueva a fondo.
  tl3_jaar: '2009'
  tl3_titel: Compra del edificio
  tl3_tekst: Después de 5 años de alquiler, la iglesia compra el edificio, financiado en gran parte mediante donativos y en parte a través de una hipoteca.
  tl4_jaar: '2013'
  tl4_titel: Construcción de la sala de la iglesia actual
  tl4_tekst: La antigua sala tenía capacidad para unos 100 visitantes. La nueva sala, terminada por la propia iglesia, tiene capacidad para 300 visitantes.
  tl5_jaar: '2016'
  tl5_titel: Tim y Vanessa Laurey se convierten en pastores
  tl5_tekst: Los fundadores Cees y Agnès se jubilan; su hijo Tim y su esposa Vanessa se convierten en los pastores de Open Kerk.
  tl6_jaar: '2023'
  tl6_titel: Visión de ampliación
  tl6_tekst: Cada domingo, unos 300 adultos y 80 niños. Los espacios se sienten llenos; Dios impulsa al liderazgo hacia la ampliación.
  tl7_jaar: '2024'
  tl7_titel: Compra de parcelas y permiso de construcción
  tl7_tekst: Se compran dos parcelas boscosas adyacentes en un mes. Buro-B Architecten diseña el nuevo edificio; el permiso se aprueba sin objeciones. Las luces se ponen en verde.
  tl8_jaar: '2026'
  tl8_titel: 'Fase 1: construcción de la Iglesia infantil'
  tl8_tekst: Construcción de la iglesia infantil y un "camino de obra" con futuras plazas de aparcamiento. En el segundo semestre del año los niños se trasladan al nuevo edificio.
  tl9_jaar: Más adelante
  tl9_titel: Fases 2, 3 y 4
  tl9_tekst: Nueva sala, entrada de cristal, espacio multifuncional y zona exterior con 160 plazas de aparcamiento, en parte para personas con movilidad reducida y con puntos de carga.
  fin_meta: Administración responsable
  fin_heading: Cómo pensamos financiar esto
  fin_p1: Como iglesia queremos gestionar el dinero de forma responsable. Este proyecto es posible porque Open Kerk contribuye sustancialmente con donativos y reservas, y porque visitantes habituales y personas implicadas prestan y/o donan.
  fin_p2: Optamos por una combinación de recursos propios, préstamos de nuestro propio círculo, y estamos abiertos a préstamos externos, con un plan de devolución realista a largo plazo. De esta manera hacemos justicia a la administración responsable y al llamado a construir, en esta región, una casa de oración, enseñanza y comunidad.
  voorwie_heading: ¿Para quién es este proyecto de construcción?
  voorwie_p1: 'Este proyecto no está ahí "por el edificio en sí", sino por las personas: por niños y jóvenes que, en un entorno seguro y amplio, aprenden lo que significa seguir a Jesús; por familias y solteros que sirven juntos a Dios y se encuentran; por la región de Lommel y alrededores; y por las generaciones futuras: nuestros hijos y los hijos de ellos.'
  voorwie_p2: Vemos este edificio como un medio para edificar la iglesia de Cristo, en buen entendimiento con otras iglesias y comunidades de fe de la ciudad.
  betrokken_heading: Cómo puedes participar
  betrokken_p1_before: Estamos agradecidos por todos los que apoyan este proyecto dentro y fuera de nuestra iglesia. Orando juntos por sabiduría, protección y fruto espiritual.
  betrokken_link_geven: Donar
  betrokken_p1_after: a través de los canales habituales de Open Kerk, con la referencia "Proyecto de construcción". Piensa con nosotros si conoces a alguien que pueda ayudar a financiar este proyecto mediante un préstamo. En cuanto haya hitos importantes, los compartiremos en esta página y a través de la app de nuestra iglesia.
  betrokken_contact: Ponte en contacto
kampen:
  page_title: Campamentos OPEN. Kerk
  hero_heading: Nos vamos juntos de <span class="underline">campamento</span>
  hero_subtitle: Cada año salimos con niños, jóvenes y hombres.<br>Días llenos de fe, amistad y aventura.
  hero_button: Ver los campamentos
  intro_heading: Tres campamentos, un objetivo
  intro_paragraph: 'Tengas 6 o 60 años, hay un campamento para ti. Elige un campamento abajo para ver todos los detalles: fechas, costes, tema y respuestas a tus preguntas.'
  tab_kinder: Campamento infantil
  tab_jong: Jong° Summer Camp
  tab_realmen: Real Men Camp
  fact_when_label: Cuándo
  fact_cost_label: Coste
  fact_who_label: Para quién
  fact_location_label: Ubicación
  fact_theme_label: Tema
  fact_stay_label: Alojamiento
  kinder_kicker: De 6 a 12 años
  kinder_title: Campamento infantil
  kinder_tagline: 'Juntos con un objetivo: ¡conocer a Jesús!'
  kinder_when_value: 16 – 19 de agosto
  kinder_cost_value: € 95
  kinder_who_value: Primaria, de 6 a 12 años
  kinder_location_value: Nieuwe Kopen 14, Lommel
  kinder_theme_value: Primer amor
  kinder_intro: 'Cada año organizamos un maravilloso campamento infantil para niños de primaria, con un objetivo claro: conocer a Jesús. Los niños no solo aprenden sobre Él, sino que también lo experimentan a través de la enseñanza, la oración, la alabanza y la adoración, y mucho tiempo para hacer deporte, divertirse y construir amistades.'
  kinder_faq1_title: Para quién es
  kinder_faq1_body: <p>Para todos los niños de primaria (a partir de los 6 años), con o sin trasfondo cristiano. ¡Eres muy bienvenido!</p>
  kinder_faq2_title: Las actividades
  kinder_faq2_body: '<p>Cada día empezamos con un servicio en torno al tema. Después nos ponemos creativos y activos. Por la noche hay un servicio de adoración. Entremedias: deporte, juegos, estar al aire libre y divertirse.</p>'
  kinder_faq3_title: El tema Primer amor
  kinder_faq3_body: <p>Amamos a Dios porque Él nos amó primero (Juan 3:16). A lo largo de tres días exploramos a través de la Biblia lo grande que es el amor de Jesús por nosotros, y lo que significa amar a Dios con todo tu corazón, alma y mente.</p>
  kinder_faq4_title: Inscripción
  kinder_faq4_body: <p>Puedes inscribirte hasta el 14 de junio de 2026. La participación está sujeta a la aceptación de las normas del campamento. Una vez completado el formulario y recibido el pago, la inscripción queda completa. No recibirás una confirmación por correo electrónico.</p>
  kinder_faq5_title: Pago
  kinder_faq5_body: '<p>El coste es de € 95 y debe transferirse a más tardar el 1 de julio de 2026 a la cuenta de Kinderkerk:</p><p><strong>NL82 ABNA 0246 4531 92</strong> a nombre de Kinderkerk<br>Con la referencia: Nombre del niño + Kinderkamp 2026</p><p>También se permiten dos plazos: € 50 antes del 1 de junio y € 45 antes del 1 de julio.</p>'
  kinder_cta: Inscríbete en el Campamento infantil
  jong_kicker: Secundaria
  jong_title: Jong° Summer Camp
  jong_tagline: Cuatro días, un objetivo
  jong_when_value: 19 – 22 de agosto
  jong_cost_value: € 110
  jong_who_value: A partir de la edad de secundaria
  jong_location_value: Nieuwe Kopen 14, Lommel
  jong_theme_value: Inside Out
  jong_intro: 'Cuatro días en los que, en un ambiente divertido y con muchas risas, compartimos un objetivo: conocer mejor a Jesús como nuestro Amigo, Salvador y Ayudador. Con servicios juveniles, adoración, actividades de Fun & Adventure y mucho tiempo libre.'
  jong_faq1_title: Para quién es
  jong_faq1_body: '<p>Para jóvenes a partir de la edad de secundaria, con o sin trasfondo cristiano. ¿Tienes más de 18 años y quieres venir? Bienvenido: entonces te pediremos que ayudes con alguna tarea.</p>'
  jong_faq2_title: Las actividades
  jong_faq2_body: '<p>Servicios juveniles con adoración y temas que realmente puedes aplicar en tu vida diaria, geniales actividades de Fun & Adventure, y tiempo libre para conocer mejor tanto a Dios como a tus amigos. Y sobre todo: mucha diversión y buena compañía.</p>'
  jong_faq3_title: El tema Inside Out
  jong_faq3_body: <p>La enseñanza trata sobre nuestro interior y nuestro exterior. Cuando cambiamos de dentro hacia fuera, el fruto solo se hace visible en el exterior. La Biblia está llena de lecciones sobre cómo podemos (en nuestro corazón) parecernos más a Jesús.</p>
  jong_faq4_title: Inscripción
  jong_faq4_body: <p>Puedes inscribirte hasta el 14 de junio de 2026. La participación está sujeta a la aceptación de las normas del campamento. Una vez completado el formulario y recibido el pago, tu inscripción queda completa. No recibirás una confirmación por correo electrónico.</p>
  jong_faq5_title: Pago
  jong_faq5_body: '<p>El coste es de € 110 y debe transferirse a más tardar el 1 de julio de 2026 a la cuenta de Jong°:</p><p><strong>NL48 ABNA 0246 4532 22</strong> a nombre de Jong°<br>Con la referencia: Tu nombre + SummerCamp 2026</p><p>También se permiten dos plazos: € 50 antes del 1 de junio y € 60 antes del 1 de julio. Para cancelaciones después del 1 de julio cobramos la mitad de la cuota del campamento.</p>'
  jong_faq6_title: Las normas del campamento
  jong_faq6_body: '<p>Campamento sin tabaco y sin alcohol. Asegúrate de estar asegurado tú mismo (ten en cuenta tu seguro de viaje al extranjero). No olvides tu documento de identidad. Mejor deja los objetos de valor en casa. No se desea el uso de teléfono, tableta o consola: un mensajito a tu madre, por supuesto, está bien.</p>'
  jong_cta: Inscríbete en el Summer Camp
  realmen_kicker: Hombres a partir de 16 años
  realmen_title: Real Men Camp
  realmen_tagline: Animados, motivados y despiertos
  realmen_when_value: 11 – 13 de septiembre
  realmen_cost_value: € 100
  realmen_who_value: Hombres a partir de 16 años
  realmen_location_value: Domaine du Bocq, Purnode
  realmen_stay_value: Camping y tiendas
  realmen_intro: 'Un fin de semana para hombres de Open Kerk y de fuera. Tanto si llevas años como si solo vienes a echar un vistazo: eres bienvenido tal como eres. No historias perfectas, sino reales. Sobre la fe, la lucha, caer y volver a levantarse, y seguir a Jesús en la vida real. No estás solo en esto.'
  realmen_faq1_title: ¿Qué puedo esperar?
  realmen_faq1_body: '<p>Historias reales, buenas conversaciones junto al fuego, actividades y aventura, comida y hermandad. Se trata de más que de buena compañía: crecer juntos, animarnos juntos y buscar a Jesús juntos.</p>'
  realmen_faq2_title: ¿Para quién es?
  realmen_faq2_body: <p>Para todos los hombres a partir de 16 años. Con mucha fe o con preguntas, presentes desde hace años o uniéndose por primera vez. Ven no porque todo esté en orden, sino precisamente porque necesitamos a Jesús.</p>
  realmen_faq3_title: Todavía no conozco a muchos hombres. ¿Incómodo?
  realmen_faq3_body: '<p>Quizás por un momento, y no pasa nada. A los hombres los conoces precisamente viniendo: durante las comidas, junto al fuego, por el camino o simplemente entre medias. No tienes que ser el más ruidoso. Solo ven y participa.</p>'
  realmen_faq4_title: Dormir y alojamiento
  realmen_faq4_body: '<p>Dormimos en tiendas que ya están montadas para ti: trae tu propio colchón (hinchable) o cama de camping. ¿Prefieres más comodidad? Reserva una tienda de glamping por tu cuenta, o consíguete un Airbnb/hotel cercano. También puedes venir solo el sábado y dormir en casa. Indícanos tu elección en el formulario.</p>'
  realmen_faq5_title: Inicio y final
  realmen_faq5_body: '<p>Viernes 11 de septiembre a partir de las 16:00 h (no antes: el lugar no está disponible antes). Unirse más tarde por trabajo o estudios está bien. El domingo 13 de septiembre terminamos a las 8:00 h y vamos directamente al culto en Lommel.</p>'
  realmen_faq6_title: Pago
  realmen_faq6_body: '<p>El coste es de € 100 (incluye comida, actividades y alojamiento) y debe transferirse a más tardar el 1 de septiembre a nombre de Open Kerk:</p><p><strong>NL:</strong> NL55 ABNA 0528 2626 37<br><strong>BE:</strong> BE88 7352 1819 7141<br>Con la referencia: Tu nombre + Real Men 2026</p><p>Open Kerk nunca trabaja con ánimo de lucro: el importe cubre exactamente los costes del fin de semana.</p>'
  realmen_cta: Inscríbete en el Real Men Camp
