home:
  title: OPEN. Kerk Abiertos a Dios, abiertos a ti.
  hero_title: Abiertos a Dios,<br>abiertos a ti.
  hero_subtitle: 'La iglesia es una casa de oración. Jesús dijo: ‘Mi templo será llamado casa de oración para todas las naciones.’ Nuestro objetivo es crear un lugar de la presencia de Dios buscándolo'
  hero_subtitle_underline: en adoración y oración.
  hero_button: Únete
  who_we_are_title: Quiénes somos
  who_we_are_body: '<p>Open Kerk es una iglesia evangélica en Lommel. Desde 1983 ayudamos a las personas a conocer a Dios, a seguir a Jesús y a dar forma juntos a la fe en la vida diaria.</p><p>Tanto si crees desde hace años, como si tienes dudas o simplemente sientes curiosidad: eres bienvenido. Creemos que Dios es bueno y que una vida con Él marca la diferencia.</p><p>Cada domingo a las 10:30 h.</p><p>Abiertos a Dios. Abiertos a ti.</p>'
  believe_section_title: ¿Qué significa creer en Dios?
  belief_1_title: Dios es amor
  belief_1_body: Lo más importante que una persona puede saber sobre Dios es que Él es bueno. Puedes confiar en Él y en su Palabra. Dios hizo todo y ama su creación. Lo mejor para ti y para mí es vivir a su manera. Por eso es bueno darse cuenta de que Dios te ama y quiere lo mejor para ti. El amor de Dios no depende de lo que logras ni de cuán bien lo haces. Él te conoce por completo, con todas tus fortalezas y debilidades, y aun así elige amarte. A lo largo de toda la Biblia vemos a un Dios que busca a las personas, las perdona, las restaura y las invita a vivir cerca de Él. Su amor da esperanza, descanso y un fundamento sólido para la vida.
  belief_2_title: Jesús es Dios
  belief_2_media_title: Jesús es Dios
  belief_2_body: La Biblia describe cómo Dios mismo se hizo Hombre para restaurar la amistad entre Dios y las personas. Por nuestra libertad hemos hecho, además de muchas cosas buenas, también muchas cosas malas. La Biblia llama a esto pecado, y por el pecado se rompió la amistad entre Dios y las personas. Jesús la restauró mostrando y enseñando cómo una persona puede vivir como hijo de Dios. Jesús murió por tus pecados y los míos en una cruz, pero resucitó de entre los muertos. Al creer en Él, tú y yo recibimos una nueva vida; la vida verdadera, libre de pecado y en amistad con Dios.
  belief_3_title: La Biblia es la Palabra de Dios
  belief_3_body: La Biblia proclama la Palabra y la Verdad eternas. Un cristiano sigue cuidadosamente la Palabra de Dios. Esa obediencia da lugar a una vida con Dios, en esperanza y paz. A través de la Biblia, Dios nos enseña quién es Él y cómo podemos vivir. Su Palabra da dirección en tiempos difíciles y nos ayuda a tomar buenas decisiones. La Biblia es más que una colección de historias antiguas; es el mensaje vivo de Dios para las personas de hoy. Quien lee la Biblia con un corazón abierto descubre el amor, la sabiduría y el plan de Dios para su vida.
  belief_4_title: Jesús nos pide que le sigamos
  belief_4_body: 'Jesús dijo una vez: "No solo escuches lo que digo, sino hazlo también." Cuando haces lo que Jesús dice en su Palabra, te pareces más a Él y eres una bendición no solo para ti mismo, sino también para el mundo que te rodea. Seguir a Jesús significa confiar en Él e imitar su ejemplo en la vida diaria. Él nos enseña a amar a Dios y a servir a nuestro prójimo con amor, verdad y gracia. Jesús llama a las personas no solo a creer en Él, sino también a vivir como sus discípulos. Es un viaje que dura toda la vida, en el que aprendemos cada vez más a pensar, hablar y actuar como Él. En el camino no nos deja solos, sino que nos ayuda por su Espíritu a crecer en fe y amor.'
  belief_5_title: Padre, Hijo y Espíritu Santo
  belief_5_body: Dios es uno. Él es el Creador de todo lo que existe y Señor sobre la creación. Dios es Padre porque nos crea, nos guía y nos protege. Dios es el Hijo porque se hizo humano para restaurar la amistad entre Él y nosotros. Dios es el Espíritu Santo que habita en todas las personas que creen en Él. El Padre, el Hijo y el Espíritu Santo no son tres dioses, sino un solo Dios que se nos da a conocer de tres maneras. A través del Espíritu Santo, los creyentes pueden experimentar cada día la presencia, dirección y poder de Dios.
  belief_6_title: La Gran Comisión
  belief_6_body: 'Antes de que Jesús volviera al cielo, dio a sus seguidores una clara misión: dar a conocer el Evangelio y enseñar a las personas a vivir como sus discípulos. A esta misión la llamamos la Gran Comisión. Jesús llama a su iglesia a compartir su amor, verdad y salvación con el mundo. Nosotros también, como Open Kerk, queremos ocupar nuestro lugar en esa misión. Aquí en Lommel, en este tiempo, anhelamos que las personas lleguen a conocer a Jesús, crezcan en su fe y le sigan. Por eso edificamos una iglesia donde las personas puedan encontrarse con Dios, ser equipadas en su Palabra y juntos marcar la diferencia en su entorno.'
  leaders_title: Conoce a nuestros líderes
  leaders_subtitle: Estos son los pastores que nos guían en el discipulado.
  leader_1_name: Tim Laurey
  leader_1_role: Pastor de OpenKerk.
  leader_2_name: Vanessa Laurey
  leader_2_role: Pastora de OpenKerk.
activiteiten:
  page_title: Actividades OPEN. Kerk
  hero_heading: ¿Qué se puede<br><span class="underline">hacer en la iglesia?</span>
  hero_subtitle: Cada semana hay mucho que vivir en Open Kerk.<br>Desde el culto del domingo hasta los lifegroups, la oración y los campamentos —<br>hay un lugar para ti.
  intro_title: Todas las actividades en Open. Kerk
  intro_text: Una iglesia viva se reúne no solo el domingo, sino durante toda la semana. A continuación encontrarás todo lo que se hace. Descarga nuestra app para las últimas novedades, horarios y ubicaciones.
  kerkdienst_meta: Cada domingo · 10:30 – 12:30 h
  kerkdienst_title: Culto
  kerkdienst_desc: Cada domingo a las 10:30 h. Date un año entero para venir a la iglesia cada semana. Aprende sobre Dios. Y descubre cómo todo empieza a verse mejor.
  kinderkerk_meta: Cada domingo · 10:30 – 12:30 h
  kinderkerk_title: Iglesia infantil
  kinderkerk_desc: Mientras los mayores disfrutan del culto habitual, los niños desde luego no deben quedarse fuera. Por eso es tan agradable saber que existe una estupenda OPEN. Iglesia infantil donde cada niño es bienvenido. Todo está orientado a acercar a los niños a Dios.
  jong_meta: 2× al mes · viernes por la noche
  jong_title: Jong°
  jong_desc: Jongº es el grupo de jóvenes de OPEN Kerk. Dos veces al mes, los viernes por la noche, se reúnen para una velada agradable. Comparten un único objetivo… y es conocer mejor a Jesús, personalmente y como grupo. Vivir con Dios es emocionante… se siente familiar… y nos enseña quiénes somos de verdad.
  gebed_meta: Cada lunes · 19:30 – 21:00 h
  gebed_title: Oración y adoración
  gebed_desc: Cada lunes por la noche nos reunimos en Open. Kerk para adorar a Dios y orar juntos. Todos son bienvenidos a participar. El último jueves de cada mes celebramos una noche de Intercesión, en la que oramos no por nosotros mismos, sino por los demás.
  lifegroups_meta: Cada mes
  lifegroups_title: Lifegroups
  lifegroups_desc: Una vez al mes nos reunimos en grupos pequeños para disfrutar de una comida y hablar sobre la fe. A través de estos grupos construyes amistades verdaderas y creces en tu relación con Dios.
  realmen_meta: Cada mes
  realmen_title: Real Men
  realmen_desc: Una vez al mes, los hombres se reúnen en grupos pequeños para hablar sobre la fe, construir amistad y animarse mutuamente.
  vrouwen_meta: 2× al año
  vrouwen_title: Noche de mujeres
  vrouwen_desc: Dos veces al año hay una noche, un viernes, especialmente para mujeres. Tienen lugar en Open. Kerk y son tan agradables y edificantes que de verdad no querrás perdértelas.
  nieuwestart_meta: 2× al año · 4 miércoles
  nieuwestart_title: Nuevo comienzo
  nieuwestart_desc: Dos veces al año puedes apuntarte al Nuevo Comienzo. Durante 4 miércoles por la noche hablamos de los fundamentos de la fe en Jesús. Apúntate para participar en el próximo nuevo comienzo.
  kampen_meta: Anual · vacaciones de verano
  kampen_title: Campamentos de verano
  kampen_desc: Cada año organizamos campamentos de verano para niños y jóvenes durante las vacaciones de verano. Para los hombres de Open. Kerk organizamos en septiembre un fin de semana de aventura en las Ardenas.
  app_title: Mantente al día
  app_text: Compartimos todas las actividades en la app de Open. Kerk. Puedes descargarla usando el código QR que aparece regularmente en pantalla durante los cultos de Open. Kerk.
live:
  page_title: En directo OPEN. Kerk
  hero_heading: <span class="underline">En directo</span>
  hero_subtitle: ¿No puedes estar en persona? Síguenos en directo.<br>Cada domingo a las 10:30 h.
  hero_button: Ver la emisión
  stream_title: El culto de hoy
  stream_text: Cada domingo a las 10:30 h emitimos el culto en directo. Únete desde casa o vuelve a ver un culto anterior.
  offline_status: En este momento no hay emisión
  offline_text: La próxima emisión en directo es este domingo a las 10:30 h. Hasta entonces puedes volver a ver cultos anteriores.
  offline_link: Ver cultos anteriores
  welcome_title: Eres bienvenido
  welcome_text: Es importante que te sientas en casa y que estés presente tanto como sea posible. Seguirnos en línea está muy bien, pero por supuesto también eres muy bienvenido a visitarnos en Lommel. Abiertos a Dios, abiertos a ti.
