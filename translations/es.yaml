  questions_heading: ¿Alguna pregunta?
  questions_paragraph: '¿Tienes preguntas sobre alguno de los campamentos? No dudes en ponerte en contacto: estaremos encantados de ayudarte. Abiertos a Dios, abiertos a ti.'
