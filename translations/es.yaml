anbi:
  title: ANBI
  hero_heading: <span class="underline">ANBI</span>
  hero_subtitle: OPEN. Kerk tiene reconocido el estatus ANBI.<br>Aquí encontrarás nuestros datos, nuestra junta y nuestra rendición de cuentas.
  doelstelling_heading: Misión
  doelstelling_p1: OPEN. Kerk es una iglesia evangélica protestante. Creemos en Jesucristo; Dios y Salvador de todas las personas en la tierra. Nos reunimos como creyentes para honrar a Dios Padre, en el nombre de Jesucristo nuestro Salvador, y trabajamos inspirados por el Espíritu Santo para llevar a cabo las buenas obras de la iglesia de Jesucristo en la región de la Campina. El objetivo de nuestra iglesia es informar a las personas de nuestra región de que hay un Dios que las ama y mostrar que Jesucristo vive y que vivir según sus mandamientos ofrece, como resultado, una vida de bendición y abundancia.
  doelstelling_p2: Todas nuestras actividades se basan en esta buena causa. La iglesia enseña a sus visitantes sobre el amor de Jesús, canta cánticos para honrar a Dios Padre, y da a los niños, de forma lúdica y educativa, la conciencia de que Dios siempre está ahí para ellos. Da a los pobres y ofrece ayuda a las personas en las diversas necesidades de esta vida en la enfermedad, el dolor y los problemas personales. La iglesia también es activa en el trabajo con jóvenes, para que los jóvenes puedan desarrollarse hacia su futura posición en la sociedad como hijos de Dios.
  doelstelling_p3: En resumen, la iglesia se esfuerza por que todas las personas vivan en el amor, la gracia y la protección de Jesucristo, nuestro Dios.
