  intro_body: Aquí guardamos cada prédica de OPEN. Kerk para que puedas volver a verla cuando quieras retomar el vídeo desde cualquier momento, buscar en todos los mensajes por palabra o pasaje y seguirlos con subtítulos en cuatro idiomas (neerlandés, inglés, francés y español). Tanto si quieres profundizar en un tema, compartir una prédica con alguien en otro idioma o simplemente ponerte al día con un culto que te perdiste, todo el archivo está a tu disposición.
