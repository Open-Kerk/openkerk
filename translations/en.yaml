nieuwbouw:
  page_title: New Building OPEN. Kerk
  hero_heading: Open Kerk Building Project
  hero_subtitle: Room to grow now and for <span class="underline">the generations to come.</span>
  waarom_heading: Why we are building
  waarom_p1: Open Kerk has been present in Lommel since 1983. What began as a small house church has grown into a church with hundreds of visitors on Sundays. We are grateful for that growth – but in our building we are now literally running up against its limits.
  waarom_p2: 'The church hall is regularly full and the children''s church rooms are structurally too small. At the same time, more and more people, from Lommel and the wider region, are finding their way to Open Kerk. That is why we are investing in a future-proof building on the Saskesdreef: a single location where the Word of God remains central, with enough space for worship services, Children''s Church and fellowship – also for the generations after us.'
  video_fallback: Your browser does not support this video.
  stap_heading: Built step by step
  stap_p1: Open Kerk has been based on the Saskesdreef for years. First the existing building was renovated, then the current church hall and parking spaces were added. At the end of 2023, the vision arose to thoroughly renew and expand the site.
  stap_p2: Two adjacent woodland plots were purchased and included in the building plan space for extra parking, play areas and rainwater storage on our own grounds. In 2024 Buro-B Architecten from Genk developed the plan; the building permit has been granted and is final. So we really can start building.
  fases_heading: Building in 4 phases
  fases_intro: The building project is deliberately phased. This way we build step by step, keep welcoming visitors at the same location, and shape the financing responsibly.
  fase1_num: Phase 1
  fase1_title: A new children's church
  fase1_desc: Enough rooms for the various age groups, good acoustics and safe, well-organised spaces, directly connected to the rest of the building. Also a new kitchen and sanitary facilities. Not a "nice little corner", but a fully-fledged place in the heart of the church.
  fase1_plan: 'Planning: first half of 2026'
  fase2_num: Phase 2
  fase2_title: New church hall
  fase2_desc: The old part will be demolished and replaced by a new, larger church hall. The current hall (2013) will remain and become the "link" between the church hall, children's church and multipurpose space. More seats, good sightlines, acoustics and technology suitable for worship services, baptismal services and special gatherings.
  fase3_num: Phase 3
  fase3_title: Entrance & multifunctional hall
  fase3_desc: 'The existing church hall will get a glass facade and become the new entrance and connecting space. The other half will become a multifunctional meeting space: youth church and teen activities, weddings and funeral services, congregation evenings, courses and conferences.'
  fase4_num: Phase 4
  fase4_title: Redesign of the outdoor area
  fase4_desc: Additional and better organised parking, safe walking routes for children and parents, greenery and play areas, and facilities for rainwater storage. Thanks to the new plots, the site remains spacious and green, with plenty of open space.
  kinderkerk_meta: Phase 1 · first half of 2026
  kinderkerk_heading: A home for the children
  kinderkerk_p1: On the ground floor there will be "airport-style" toilet blocks, a kitchen and children's rooms. On the first floor, toilets for children, children's rooms and a consultation room. Towards the end of summer 2026, the children will festively move from the old to the new building.
  tijdlijn_heading: Timeline
  tl1_jaar: '1983'
  tl1_titel: Started as a house church in Eersel
  tl1_tekst: Cees & Agnès Laurey start the church from their living room. Soon too small; the growing church uses village halls in the Kempen region.
  tl2_jaar: '2004'
  tl2_titel: Rental and renovation of Saskesdreef 10
  tl2_tekst: After a long search and much prayer, the church is able to rent the "Lenteleven" building. With combined efforts it is thoroughly renovated.
  tl3_jaar: '2009'
  tl3_titel: Purchase of the building
  tl3_tekst: After 5 years of renting, the church buys the building, largely financed through donations and partly via a mortgage.
  tl4_jaar: '2013'
  tl4_titel: Construction of the current church hall
  tl4_tekst: The old hall seated around 100 visitors. The new hall, finished by the church itself, seats 300 visitors.
  tl5_jaar: '2016'
  tl5_titel: Tim & Vanessa Laurey become pastors
  tl5_tekst: Founders Cees & Agnès retire; their son Tim and his wife Vanessa become the pastors of Open Kerk.
  tl6_jaar: '2023'
  tl6_titel: Vision for expansion
  tl6_tekst: Every Sunday around 300 adults and 80 children. The spaces feel full; God urges the leadership towards expansion.
  tl7_jaar: '2024'
  tl7_titel: Purchase of plots & building permit
  tl7_tekst: Two adjacent woodland plots are bought within a month. Buro-B Architecten designs the new building; the permit is approved without objection. The lights turn green.
  tl8_jaar: '2026'
  tl8_titel: 'Phase 1: construction of the Children''s Church'
  tl8_tekst: Construction of the children's church and a "construction road" with later parking spaces. In the second half of the year the children move to the new building.
  tl9_jaar: Later
  tl9_titel: Phases 2, 3 & 4
  tl9_tekst: New hall, glass entrance, multifunctional space and outdoor area with 160 parking spaces, partly for people with reduced mobility and with charging points.
  fin_meta: Responsible stewardship
  fin_heading: How we intend to finance this
  fin_p1: As a church we want to handle money responsibly. This project is possible because Open Kerk itself contributes substantially from donations and reserves, and because regular visitors and those involved lend and/or give.
  fin_p2: We opt for a mix of our own resources, loans from within our own circle, and are open to external loans, with a realistic long-term repayment plan. In this way we do justice to stewardship and to the calling to build, in this region, a house of prayer, teaching and community.
  voorwie_heading: Who is this building project for?
  voorwie_p1: This project is not there "for the building itself", but for people for children and young people who, in a safe, spacious environment, learn what it means to follow Jesus; for families and singles who serve God together and meet one another; for the Lommel region and surroundings; and for future generations our children and their children.
  voorwie_p2: We see this building as a means to build up the church of Christ, in good understanding with other churches and faith communities in the city.
  betrokken_heading: How you can get involved
  betrokken_p1_before: We are grateful for everyone who supports this project within and outside our church. Praying along for wisdom, protection and spiritual fruit.
  betrokken_link_geven: Give
  betrokken_p1_after: through the usual channels of Open Kerk, with the reference "Building project". Think along if you know someone who can help finance this project through a loan. As soon as there are important milestones, we will share them on this page and via our church app.
  betrokken_contact: Get in touch
