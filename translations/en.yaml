  intro_heading: Welcome to the OPEN. Kerk sermon archive
  intro_body: This is where every OPEN. Kerk sermon lives so you can revisit it whenever you like jump to any moment in the video, search across the talks for a word or passage, and follow along with subtitles in four languages (Dutch, English, French and Spanish). Whether you want to study a topic again, share a sermon with a friend in another language, or simply catch up on a service you missed, the whole archive is here for you.
