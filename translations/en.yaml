  doelstelling_heading: Mission
  doelstelling_p1: OPEN. Kerk is a Protestant evangelical church. We believe in Jesus Christ; God and Saviour of all people on earth. We come together as believers to honour God the Father, in the name of Jesus Christ our Saviour, and work inspired by the Holy Spirit to carry out the good works of the church of Jesus Christ in the Kempen region. The aim of our church is to inform the people in our region that there is a God who loves them and to show that Jesus Christ lives and that living according to His commandments offers a life of blessing and abundance as a result.
  doelstelling_p2: All our activities are based on this good cause. The church teaches its visitors about the love of Jesus, sings songs to honour God the Father, and gives children, in a playful and educational way, the awareness that God is always there for them. It gives to the poor and offers help to people in the various needs of this life in sickness, sorrow and personal problems. The church is also active in youth work, so that young people can develop into their future position in society as a child of God.
  doelstelling_p3: In short, the church strives for all people to live in the love, grace and protection of Jesus Christ, our God.
