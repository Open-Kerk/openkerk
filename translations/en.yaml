  kinder_kicker: Ages 6 to 12
  kinder_title: Children's Camp
  kinder_tagline: 'Together with one goal: meeting Jesus!'
  kinder_when_value: 16 – 19 August
  kinder_cost_value: € 95
  kinder_who_value: Primary school, ages 6–12
  kinder_location_value: Nieuwe Kopen 14, Lommel
  kinder_theme_value: First love
  kinder_intro: 'Every year we organise a wonderful children''s camp for primary school kids, with one clear goal: meeting Jesus. The kids don''t just learn about Him, they also get to experience Him through teaching, prayer, praise & worship and plenty of time to play sports, have fun and build friendships.'
  kinder_faq1_title: Who it's for
  kinder_faq1_body: <p>For all primary school children (from age 6), with or without a Christian background. You're very welcome!</p>
  kinder_faq2_title: The activities
  kinder_faq2_body: '<p>Each day we start with a service around the theme. After that we get creative and active. In the evening there''s a worship service. In between: sports, games, being outdoors and having fun.</p>'
  kinder_faq3_title: The theme First love
  kinder_faq3_body: <p>We love God because He first loved us (John 3:16). Over three days we explore through the Bible how great Jesus' love for us is, and what it means to love God with all your heart, soul and mind.</p>
  kinder_faq4_title: Registration
  kinder_faq4_body: <p>You can register until 14 June 2026. Participation is subject to acceptance of the camp rules. Once the form is completed and the payment received, registration is complete. You will not receive a confirmation by email.</p>
  kinder_faq5_title: Payment
  kinder_faq5_body: '<p>The cost is € 95 and must be transferred no later than 1 July 2026 to the Kinderkerk account:</p><p><strong>NL82 ABNA 0246 4531 92</strong> in the name of Kinderkerk<br>With reference: Child''s name + Kinderkamp 2026</p><p>Two instalments are also allowed: € 50 before 1 June and € 45 before 1 July.</p>'
  kinder_cta: Register for Children's Camp
  jong_kicker: Secondary school
  jong_title: Jong° Summer Camp
  jong_tagline: Four days, one goal
  jong_when_value: 19 – 22 August
  jong_cost_value: € 110
  jong_who_value: From secondary school age
  jong_location_value: Nieuwe Kopen 14, Lommel
  jong_theme_value: Inside Out
  jong_intro: 'Four days in which, in a fun atmosphere and with lots of laughs, we share one goal: getting to know Jesus better as our Friend, Saviour and Helper. With youth services, worship, Fun & Adventure activities and plenty of free time.'
  jong_faq1_title: Who it's for
  jong_faq1_body: <p>For young people from secondary school age, with or without a Christian background. Are you over 18 and want to join? Welcome we'll then ask you to help out with a task.</p>
  jong_faq2_title: The activities
  jong_faq2_body: '<p>Youth services with worship and themes you can really use in your daily life, awesome Fun & Adventure activities, and free time to get to know both God and your friends better. And above all: lots of fun and good company.</p>'
  jong_faq3_title: The theme Inside Out
  jong_faq3_body: <p>The teaching is about our inside and our outside. When we change from the inside out, the fruit only becomes visible on the outside. The Bible is full of lessons on how we (in our hearts) can become more like Jesus.</p>
  jong_faq4_title: Registration
  jong_faq4_body: <p>You can register until 14 June 2026. Participation is subject to acceptance of the camp rules. Once the form is completed and the payment received, your registration is complete. You will not receive a confirmation by email.</p>
  jong_faq5_title: Payment
  jong_faq5_body: '<p>The cost is € 110 and must be transferred no later than 1 July 2026 to the Jong° account:</p><p><strong>NL48 ABNA 0246 4532 22</strong> in the name of Jong°<br>With reference: Your name + SummerCamp 2026</p><p>Two instalments are also allowed: € 50 before 1 June and € 60 before 1 July. For cancellations after 1 July we charge half of the camp fee.</p>'
  jong_faq6_title: The camp rules
  jong_faq6_body: <p>Non-smoking and non-alcoholic camp. Make sure you're insured yourself (mind your foreign travel insurance). Don't forget your ID. Better leave valuables at home. Using a phone, tablet or game console isn't desired a quick message to your mum is of course fine.</p>
  jong_cta: Register for Summer Camp
  realmen_kicker: Men from age 16
  realmen_title: Real Men Camp
  realmen_tagline: Encouraged, spurred on and awake
  realmen_when_value: 11 – 13 September
  realmen_cost_value: € 100
  realmen_who_value: Men from age 16
  realmen_location_value: Domaine du Bocq, Purnode
  realmen_stay_value: Camping & tents
  realmen_intro: 'A weekend for men from Open Kerk and beyond. Whether you''ve been around for years or are just checking it out: you''re welcome as you are. No perfect stories, but real ones. About faith, struggle, falling and getting back up, and following Jesus in real life. You''re not in it alone.'
  realmen_faq1_title: What can I expect?
  realmen_faq1_body: '<p>Real stories, good conversations by the fire, activities and adventure, food and brotherhood. It''s about more than good company: growing together, being spurred on together and seeking Jesus together.</p>'
  realmen_faq2_title: Who is it for?
  realmen_faq2_body: <p>For all men from age 16. With lots of faith or with questions, around for years or joining for the first time. Come along not because everything is in order, but precisely because we need Jesus.</p>
  realmen_faq3_title: I don't know many men yet. Awkward?
  realmen_faq3_body: '<p>Maybe for a moment and that''ll be fine. You get to know men exactly by coming along: during the meals, by the fire, on the way or just in between. You don''t have to be the loudest. Just come and join in.</p>'
  realmen_faq4_title: Sleeping & accommodation
  realmen_faq4_body: <p>We sleep in tents that are already set up for you bring your own (air) mattress or camp bed. Prefer more comfort? Book a glamping tent at your own expense, or arrange an Airbnb/hotel nearby yourself. You can also come just on Saturday and sleep at home. Let us know your choice on the form.</p>
  realmen_faq5_title: Start & finish
  realmen_faq5_body: <p>Friday 11 September from 4:00 pm (not earlier the site isn't available before then). Joining later because of work or study is fine. On Sunday 13 September we finish at 8:00 am and drive straight to the church service in Lommel.</p>
  realmen_faq6_title: Payment
  realmen_faq6_body: '<p>The cost is € 100 (including food, activities and accommodation) and must be transferred no later than 1 September in the name of Open Kerk:</p><p><strong>NL:</strong> NL55 ABNA 0528 2626 37<br><strong>BE:</strong> BE88 7352 1819 7141<br>With reference: Your name + Real Men 2026</p><p>Open Kerk never works on a for-profit basis the amount covers exactly the costs of the weekend.</p>'
  realmen_cta: Register for Real Men Camp
