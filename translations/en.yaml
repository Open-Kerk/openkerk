home:
  title: OPEN. Kerk Open to God, open to you.
  hero_title: Open to God,<br>open to you.
  hero_subtitle: The church is a house of prayer. Jesus said, ‘My temple will be called a house of prayer for all nations.’ It is our goal to create a place of God's presence by seeking Him
  hero_subtitle_underline: in worship and prayer.
  hero_button: Join Us
  who_we_are_title: Who we are
  who_we_are_body: Open Kerk is an Evangelical congregation in Lommel, Belgium, started in 1983 as a small house church and grown into a warm community of hundreds of people who gather every week. A place where you are welcome just as you are, where faith and life are not separated from each other, and where people look out for one another. We believe that God is good and that life works best when we live it the way He intended. Not as an obligation, but as an invitation. Every Sunday at 10:30. Open to God, open to you.
  believe_section_title: What does it mean to believe in God?
  belief_1_title: God is love
  belief_1_body: The most important thing a person can know about God is that He is good. You can trust Him and His Word. God made everything and loves His creation. It is best for you and me to live His way. That is why it is good to realize that God loves you and wants the best for you. God's love does not depend on what you achieve or how well you do. He knows you fully, with all your strengths and weaknesses, and yet He chooses to love you. Throughout the entire Bible we see a God who seeks people out, forgives them, restores them, and invites them to live close to Him. His love gives hope, rest, and a solid foundation for life.
  belief_2_title: Jesus is God
  belief_2_media_title: Jesus is God
  belief_2_body: The Bible describes how God Himself became a Man to restore the friendship between God and people. Through our freedom we have, alongside many good things, also done many bad things. The Bible calls this sin, and through sin the friendship between God and people was broken. Jesus restored this by showing and teaching how a person can live as a child of God. Jesus died for your sins and mine on a cross, but rose again from the dead. By believing in Him, you and I receive new life again; the real life, free from sin and in friendship with God!
  belief_3_title: The Bible is the Word of God
  belief_3_body: The Bible speaks the eternal Word and Truth. A Christian follows the Word of God carefully. That obedience makes for a life with God, in hope and peace. Through the Bible God teaches us who He is and how we can live. His Word gives direction in difficult times and helps us make good choices. The Bible is more than a collection of old stories; it is God's living message for people today. Whoever reads the Bible with an open heart discovers God's love, wisdom, and plan for his life.
  belief_4_title: Jesus asks us to follow Him
  belief_4_body: 'Jesus once said: "Do not only listen to what I say, but also do it." When you do what Jesus says in His Word, you become more like Him and you are a blessing not only to yourself but also to the world around you. Following Jesus means trusting Him and following His example in daily life. He teaches us to love God and to serve our neighbor with love, truth, and grace. Jesus calls people not only to believe in Him, but also to live as His disciples. That is a lifelong journey in which we increasingly learn to think, speak, and act like Him. Along the way He does not leave us alone, but helps us through His Spirit to grow in faith and love.'
  belief_5_title: Father, Son and Holy Spirit
  belief_5_body: God is one. He is the Creator of all that exists and Lord over creation. God is a Father because He makes, leads and protects us. God is the Son because He became a human to restore the friendship between Him and us. God is the Holy Spirit who dwells in all people who believe in Him. The Father, the Son, and the Holy Spirit are not three gods, but one God who reveals Himself to us in three ways. Through the Holy Spirit, believers may experience God's presence, guidance, and power every day.
  belief_6_title: The Great Commission
  belief_6_body: 'Before Jesus returned to heaven, He gave His followers a clear assignment: to proclaim the gospel and to teach people to live as His disciples. We call this assignment the Great Commission. Jesus calls His church to share His love, truth, and salvation with the world. We at Open Kerk also want to take our place in that mission. Here in Lommel, in this time, we long for people to come to know Jesus, grow in their faith, and follow Him. That is why we are building a church where people can meet God, be equipped in His Word, and together make a difference in their surroundings.'
  leaders_title: Meet our leaders
  leaders_subtitle: These are the pastors who bring us discipleship.
  leader_1_name: Tim Laurey
  leader_1_role: Pastor of OpenKerk.
  leader_2_name: Vanessa Laurey
  leader_2_role: Pastor of OpenKerk.
activiteiten:
  page_title: Activities OPEN. Kerk
  hero_heading: What is there to<br><span class="underline">do at the church?</span>
  hero_subtitle: Every week there is plenty to experience at Open Kerk.<br>From the Sunday service to lifegroups, prayer and camps —<br>there is a place for you.
  intro_title: All activities at Open. Kerk
  intro_text: A living church comes together not only on Sunday, but throughout the whole week. Below you will find everything that is happening. Download our app for the latest updates, times and locations.
  kerkdienst_meta: Every Sunday · 10:30 – 12:30u
  kerkdienst_title: Church service
  kerkdienst_desc: Every Sunday at 10.30u. Give yourself a whole year to come to church every week. Learn about God. And discover how everything starts to look better.
  kinderkerk_meta: Every Sunday · 10:30 – 12:30u
  kinderkerk_title: Children's church
  kinderkerk_desc: While the grown-ups are enjoying themselves in the regular service, the children certainly should not be left out. That is why it is so nice to know there is an awesome OPEN. Children's church where every child is welcome. Everything is geared towards introducing children to God.
  jong_meta: 2× per month · Friday evening
  jong_title: Jong°
  jong_desc: Jongº is the youth group of OPEN Kerk. Twice a month on Friday evenings they get together for a fun evening. They share one goal… and that is to get to know Jesus better, personally and as a group. Living with God is exciting… feels familiar… and teaches us who we really are.
  gebed_meta: Every Monday · 19:30 – 21:00u
  gebed_title: Prayer & Worship
  gebed_desc: Every Monday evening we gather at Open. Kerk to worship God and pray together. Everyone is welcome to take part. On the last Thursday of every month we hold an Intercession evening, where we pray not for ourselves but for others.
  lifegroups_meta: Every month
  lifegroups_title: Lifegroups
  lifegroups_desc: Once a month we get together in small groups to enjoy a meal and talk about faith. Through these groups you build real friendships and grow in your relationship with God.
  realmen_meta: Every month
  realmen_title: Real Men
  realmen_desc: Once a month men gather in small groups to talk about faith, build friendship and encourage one another.
  vrouwen_meta: 2× per year
  vrouwen_title: Women's evening
  vrouwen_desc: Twice a year there is an evening on a Friday especially for women. These take place at Open. Kerk and are so enjoyable and uplifting that you really don't want to miss them!
  nieuwestart_meta: 2× per year · 4 Wednesdays
  nieuwestart_title: Fresh start
  nieuwestart_desc: Twice a year you can sign up for the Fresh Start. Over 4 Wednesday evenings we discuss the basics of faith in Jesus. Sign up to take part in the next fresh start.
  kampen_meta: Yearly · summer holidays
  kampen_title: Summer camps
  kampen_desc: Every year we organise summer camps for children and young people during the summer holidays. For the men of Open. Kerk we organise an adventurous weekend in the Ardennes in September.
  app_title: Stay up to date
  app_text: We share all activities in the Open. Kerk app. You can download it using the QR code that regularly appears on screen during the church services of Open. Kerk.
